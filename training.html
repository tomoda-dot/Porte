<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>Porte 研修アカデミー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js?v=20261113"></script>
<script src="supabase-adapter.js?v=20261113"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  min-height: 100%;
  background: #f7f4f0;
  color: #332a24;
  font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif;
  touch-action: manipulation;
}
input, select, textarea, button {
  font-family: inherit;
  font-size: 15px;
  touch-action: manipulation;
}

:root {
  --pri: #4a2c1d;              /* ディープ・エスプレッソ */
  --pri-light: #f5ece5;        /* カフェラテベージュ */
  --coffee: #684a37;           /* リッチコーヒー */
  --accent: #c06c28;           /* キャラメルアンバー */
  --accent-light: #fdf3eb;
  --bg: #f8f4ef;
  --card: #ffffff;
  --bdr: #e5dacd;
  --sub: #7a6657;
  --grn: #2e7d32;
  --grn-bg: #e8f5e9;
  --warn: #e65100;
  --warn-bg: #fff3e0;
  --blue: #1565c0;
  --blue-bg: #e3f2fd;
  --shadow-sm: 0 4px 14px rgba(56,31,19,0.06);
  --shadow-md: 0 8px 24px rgba(56,31,19,0.10);
  --shadow-lg: 0 16px 40px rgba(56,31,19,0.15);
  --radius: 20px;
}

/* ─── ヘッダー ───────────────────────────── */
header {
  background: linear-gradient(135deg, var(--pri) 0%, #2e170c 100%);
  color: #fff;
  padding: 14px 20px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 4px 18px rgba(0,0,0,0.15);
}
.header-inner {
  max-width: 960px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand-title {
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-badge {
  background: var(--accent);
  color: #fff;
  font-size: 11px;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 10px;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.mode-switch-btn {
  background: rgba(255,255,255,0.18);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  transition: all .2s;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.mode-switch-btn:hover {
  background: rgba(255,255,255,0.28);
}
.mode-switch-btn.active {
  background: #fff;
  color: var(--pri);
  border-color: #fff;
}

/* ─── コンテナ ───────────────────────────── */
.container {
  max-width: 960px;
  margin: 0 auto;
  padding: 16px;
}

/* ─── カード ─────────────────────────────── */
.card {
  background: var(--card);
  border: 1.5px solid var(--bdr);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}

/* ─── スタッフ選択グリッド（スマホ最適化） ── */
.section-title {
  font-size: 16px;
  font-weight: 900;
  color: var(--pri);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.staff-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}
.staff-card {
  background: #fff;
  border: 2px solid var(--bdr);
  border-radius: 16px;
  padding: 12px 8px;
  text-align: center;
  cursor: pointer;
  transition: all .18s ease;
  position: relative;
}
.staff-card:hover {
  transform: translateY(-2px);
  border-color: var(--coffee);
  box-shadow: var(--shadow-md);
}
.staff-card.active {
  border-color: var(--accent);
  background: var(--accent-light);
  box-shadow: 0 4px 16px rgba(192,108,40,0.25);
}
.staff-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--pri-light);
  color: var(--pri);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 900;
  margin: 0 auto 6px;
}
.staff-name {
  font-size: 14px;
  font-weight: 900;
  color: var(--pri);
}
.staff-role {
  font-size: 11px;
  color: var(--sub);
  margin-top: 2px;
}
.staff-status-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 800;
  padding: 2px 6px;
  border-radius: 8px;
  margin-top: 6px;
}
.staff-status-badge.done {
  background: var(--grn-bg);
  color: var(--grn);
}
.staff-status-badge.todo {
  background: var(--warn-bg);
  color: var(--warn);
}

/* ─── 受講者バナー ───────────────────────── */
.cur-staff-bar {
  background: linear-gradient(135deg, var(--pri-light) 0%, #fff 100%);
  border: 1.5px solid #d7ccc8;
  border-radius: 16px;
  padding: 12px 18px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.cur-staff-name {
  font-size: 15px;
  font-weight: 800;
  color: var(--pri);
}
.cur-staff-progress {
  font-size: 13px;
  font-weight: 800;
  color: var(--accent);
}

/* ─── 研修カード ─────────────────────────── */
.training-card {
  border: 2px solid var(--bdr);
  border-radius: var(--radius);
  background: #fff;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
  transition: all .2s ease;
}
.training-card.urgent {
  border-color: #ffcc80;
  background: linear-gradient(180deg, #fffbf5 0%, #fff 100%);
}
.training-card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}
.training-tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 900;
  padding: 3px 8px;
  border-radius: 8px;
  background: var(--pri-light);
  color: var(--pri);
  margin-bottom: 4px;
}
.training-title {
  font-size: 17px;
  font-weight: 900;
  color: var(--pri);
  line-height: 1.4;
}
.training-meta {
  font-size: 12px;
  color: var(--sub);
  margin-top: 4px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.training-desc {
  font-size: 13.5px;
  color: #555;
  line-height: 1.6;
  margin: 12px 0 16px;
}
.training-start-btn {
  width: 100%;
  background: linear-gradient(135deg, var(--accent) 0%, #a25218 100%);
  color: #fff;
  border: none;
  border-radius: 14px;
  padding: 13px 20px;
  font-size: 15px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(192,108,40,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all .15s;
}
.training-start-btn:hover {
  opacity: 0.95;
  transform: translateY(-1px);
}
.training-start-btn.completed {
  background: #e0d6cf;
  color: #665;
  box-shadow: none;
}

/* ─── モーダル / 受講プレイヤー ──────────── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(30,15,8,0.72);
  backdrop-filter: blur(5px);
  z-index: 1000;
  padding: 16px;
  overflow-y: auto;
  align-items: center;
  justify-content: center;
}
.modal-overlay.active {
  display: flex;
}
.modal-box {
  background: #fff;
  border-radius: 24px;
  width: 100%;
  max-width: 680px;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  max-height: 92vh;
  display: flex;
  flex-direction: column;
}
.modal-header {
  background: var(--pri);
  color: #fff;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-title {
  font-size: 16px;
  font-weight: 900;
}
.modal-close-btn {
  background: none;
  border: none;
  color: #fff;
  font-size: 22px;
  cursor: pointer;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
}
.modal-body {
  padding: 20px;
  overflow-y: auto;
  flex: 1;
}

/* ─── 動画プレイヤー枠 ───────────────────── */
.video-wrapper {
  position: relative;
  padding-bottom: 56.25%; /* 16:9 */
  height: 0;
  overflow: hidden;
  border-radius: 14px;
  background: #000;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.video-wrapper iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: 0;
}

/* ─── 要点スライド・レジュメ ─────────────── */
.keypoints-box {
  background: #faf6f2;
  border: 1.5px solid var(--bdr);
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 20px;
}
.keypoints-title {
  font-size: 14px;
  font-weight: 900;
  color: var(--pri);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.keypoints-list {
  padding-left: 18px;
  font-size: 13px;
  line-height: 1.7;
  color: #444;
}

/* ─── クイズ（1問1答 Googleマップ風） ─────── */
.quiz-step-card {
  background: #fff;
  border: 2px solid var(--bdr);
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.quiz-q-num {
  font-size: 12px;
  font-weight: 900;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.quiz-q-text {
  font-size: 16px;
  font-weight: 800;
  color: var(--pri);
  line-height: 1.5;
  margin-bottom: 16px;
}
.quiz-choices {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.choice-btn {
  background: #faf6f2;
  border: 2px solid var(--bdr);
  border-radius: 14px;
  padding: 14px 16px;
  font-size: 14.5px;
  font-weight: 700;
  color: #332a24;
  text-align: left;
  cursor: pointer;
  transition: all .15s;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.choice-btn:hover {
  background: #f0e6dd;
  border-color: var(--coffee);
}
.choice-btn.selected-correct {
  background: #e8f5e9;
  border-color: #2e7d32;
  color: #1b5e20;
}
.choice-btn.selected-wrong {
  background: #ffebee;
  border-color: #c62828;
  color: #b71c1c;
}
.quiz-explanation {
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.6;
  background: #fff8e1;
  border: 1px solid #ffe082;
  color: #5d4037;
  display: none;
}

/* ─── 所感・振り返り入力 ─────────────────── */
.reflection-box {
  margin-top: 18px;
}
.reflection-box label {
  font-size: 13.5px;
  font-weight: 800;
  color: var(--pri);
  display: block;
  margin-bottom: 6px;
}
.reflection-textarea {
  width: 100%;
  border: 1.5px solid var(--bdr);
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 14px;
  line-height: 1.5;
  outline: none;
  resize: vertical;
}
.reflection-textarea:focus {
  border-color: var(--pri);
}
.quick-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.quick-chip {
  background: #efebe9;
  border: 1px solid #d7ccc8;
  border-radius: 16px;
  padding: 4px 10px;
  font-size: 11.5px;
  font-weight: 700;
  color: #4e342e;
  cursor: pointer;
}
.quick-chip:hover {
  background: #e0d6cf;
}

/* ─── 管理者モード（星取表・印刷） ───────── */
.admin-view {
  display: none;
}
.admin-view.active {
  display: block;
}
.matrix-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  margin-top: 12px;
}
.matrix-table th, .matrix-table td {
  border: 1px solid var(--bdr);
  padding: 10px 12px;
  text-align: center;
}
.matrix-table th {
  background: #faf6f2;
  color: var(--pri);
  font-weight: 800;
}
.matrix-table td.staff-col {
  text-align: left;
  font-weight: 800;
}
.badge-ok {
  background: var(--grn-bg);
  color: var(--grn);
  font-weight: 900;
  padding: 3px 8px;
  border-radius: 10px;
  font-size: 11px;
}
.badge-no {
  background: var(--warn-bg);
  color: var(--warn);
  font-weight: 800;
  padding: 3px 8px;
  border-radius: 10px;
  font-size: 11px;
}
.print-action-bar {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-bottom: 14px;
}
.btn-print {
  background: var(--pri);
  color: #fff;
  border: none;
  border-radius: 12px;
  padding: 9px 16px;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

/* ─── A4印刷専用スタイル（実地指導用） ───── */
@media print {
  header, .header-actions, .print-action-bar, .mode-switch-btn, .modal-close-btn, .no-print {
    display: none !important;
  }
  body, html {
    background: #fff !important;
    color: #000 !important;
    font-size: 11pt !important;
  }
  .container {
    max-width: 100% !important;
    padding: 0 !important;
  }
  .card {
    border: none !important;
    box-shadow: none !important;
    padding: 0 !important;
    margin: 0 !important;
  }
}
</style>
</head>
<body>

<!-- ─── ヘッダー ─────────────────────────── -->
<header>
  <div class="header-inner">
    <div class="brand-title">
      <span>📚 Porte 研修アカデミー</span>
      <span class="brand-badge">法定研修eラーニング</span>
    </div>
    <div class="header-actions">
      <button type="button" class="mode-switch-btn active" id="btn-mode-staff" onclick="switchMode('staff')">
        📱 スタッフ受講
      </button>
      <button type="button" class="mode-switch-btn" id="btn-mode-admin" onclick="switchMode('admin')">
        👔 管理者（星取表・印刷）
      </button>
    </div>
  </div>
</header>

<div class="container">

  <!-- ══════════════════════════════════════════════
       1. スタッフ受講モード（モバイル最適化）
       ══════════════════════════════════════════════ -->
  <div id="view-staff" class="staff-view">

    <!-- Step 1: 受講するスタッフを選択 -->
    <div class="card">
      <div class="section-title">
        <span>👤 1. 受講するスタッフをタップしてください</span>
      </div>
      <div class="staff-grid" id="staff-selection-grid">
        <!-- 動的描画 -->
      </div>
    </div>

    <!-- Step 2: 選択中スタッフの受講状況 ＆ 研修一覧 -->
    <div id="staff-training-area" style="display: none;">
      <div class="cur-staff-bar">
        <div>
          <span style="font-size:12px;color:var(--sub);">受講スタッフ：</span>
          <span class="cur-staff-name" id="badge-cur-staff">〇〇 〇〇</span>
        </div>
        <div class="cur-staff-progress" id="badge-cur-progress">
          年間進捗：0/4 完了 (0%)
        </div>
      </div>

      <div class="section-title">
        <span>📖 2. 受講する研修カードを選んでください</span>
      </div>

      <!-- 研修カードリスト -->
      <div id="training-card-list">
        <!-- 動的描画 -->
      </div>
    </div>

  </div>

  <!-- ══════════════════════════════════════════════
       2. 管理者モード（受講星取表・実地指導A4印刷・議事録）
       ══════════════════════════════════════════════ -->
  <div id="view-admin" class="admin-view">

    <div class="card">
      <div class="print-action-bar no-print">
        <button type="button" class="btn-print" onclick="printTrainingOfficialReport('202611_restraint_speechlock')">
          🖨️ 11月 身体拘束研修 実地指導記録簿を印刷
        </button>
        <button type="button" class="btn-print" style="background:#2e7d32;" onclick="openCommitteeModal('restraint')">
          🏛️ 身体拘束適正化 委員会議事録を作成
        </button>
      </div>

      <div class="section-title">
        <span>📊 令和8年度 法定研修 スタッフ受講星取表（進捗マトリクス）</span>
      </div>
      <p style="font-size:12.5px;color:var(--sub);margin-bottom:12px;">
        ※全職員の受講率100%達成を目指します。実地指導（運営指導）ではこの受講実績および研修記録簿を提出します。
      </p>

      <div style="overflow-x:auto;">
        <table class="matrix-table" id="matrix-table-body">
          <!-- 動的描画 -->
        </table>
      </div>
    </div>

    <!-- 委員会議事録アーカイブ一覧 -->
    <div class="card">
      <div class="section-title">
        <span>🏛️ 委員会議事録アーカイブ（実地指導対応）</span>
      </div>
      <div id="committee-minutes-list">
        <!-- 動的描画 -->
      </div>
    </div>

  </div>

</div>

<!-- ══════════════════════════════════════════════
     受講モーダル（動画視聴 ➔ クイズ ➔ 所感保存）
     ══════════════════════════════════════════════ -->
<div class="modal-overlay" id="training-modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="modal-training-title">研修受講</div>
      <button type="button" class="modal-close-btn" onclick="closeTrainingModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-training-body">
      <!-- 動的描画 -->
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════
     委員会議事録 入力モーダル
     ══════════════════════════════════════════════ -->
<div class="modal-overlay" id="committee-modal-overlay">
  <div class="modal-box">
    <div class="modal-header" style="background:#2e7d32;">
      <div class="modal-title" id="committee-modal-title">身体拘束適正化 委員会議事録作成</div>
      <button type="button" class="modal-close-btn" onclick="closeCommitteeModal()">✕</button>
    </div>
    <div class="modal-body" id="committee-modal-body">
      <!-- 動的描画 -->
    </div>
  </div>
</div>

<script>
// ─── スタッフ定義（Porte共通マスター） ────────────────
var DEFAULT_STAFF = [
  { id: 's1', name: '友田篤賜', role: 'サービス管理責任者' },
  { id: 's2', name: '太中静香', role: '生活支援員' },
  { id: 's3', name: '奥永優斗', role: '生活支援員' },
  { id: 's4', name: '大倉基揮', role: '職業指導員' },
  { id: 's5', name: '釘村真弓', role: '職業指導員' }
];
var STAFF = DEFAULT_STAFF.slice();

// ─── 年間研修カリキュラム定義（回次別・動画＆テスト付き） ─
var TRAINING_COURSES = [
  {
    id: '202611_restraint_speechlock',
    month: '11月',
    category: '身体拘束適正化',
    title: '第2回 身体拘束適正化研修「言葉の拘束（スピーチロック）防止と現場での代替支援事例」',

// ─── ユーティリティ ─────────────────────────────────────
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function todayStr(){
  var d = new Date();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var day = String(d.getDate()).padStart(2,'0');
  return d.getFullYear() + '-' + m + '-' + day;
}

// ─── Supabase / localStorage データ同期 ───────────────
async function loadAllTrainingData(){
  try {
    // 職員マスターの動的取得（Supabase / GAS連携）
    if(typeof gas === 'function'){
      var staffList = await gas('getStaff').catch(function(){ return []; });
      if(staffList && staffList.length > 0){
        var activeStaff = staffList.filter(function(s){
          return !s.resignedDate && !s.resigned;
        });
        if(activeStaff.length > 0){
          var roleOrder = {'サービス管理責任者': 1, '管理者': 2, '生活支援員': 3, '職業指導員': 4};
          activeStaff.sort(function(a, b){
            return (roleOrder[a.role] || 99) - (roleOrder[b.role] || 99);
          });
          STAFF = activeStaff;
        }
      }
    }

    var rawRecs = await getStorageData('porte_training_records', []);
    _trainingRecords = Array.isArray(rawRecs) ? rawRecs : [];
    // 既存レコードの名前表記揺れ修正
    _trainingRecords.forEach(function(r){
      if(r.staffName === '木中静香') r.staffName = '太中静香';
    });

    var rawMinutes = await getStorageData('porte_committee_minutes', []);
    _committeeMinutes = Array.isArray(rawMinutes) ? rawMinutes : [];
    _committeeMinutes.forEach(function(m){
      if(m.attendees) m.attendees = m.attendees.replace(/木中静香/g, '太中静香');
    });
  } catch(e){
    console.warn('loadAllTrainingData error:', e);
  }
}

async function getStorageData(key, defVal){
  try {
    var sb = (typeof _getSupabase === 'function') ? _getSupabase() : (typeof supabase !== 'undefined' ? supabase : null);
    if(!sb){
      var loc = localStorage.getItem(key);
      return loc ? JSON.parse(loc) : defVal;
    }
    var res = await sb.from('設定').select('value').eq('key', key).limit(1);
    if(res.error || !res.data || res.data.length === 0){
      var loc = localStorage.getItem(key);
      return loc ? JSON.parse(loc) : defVal;
    }
    var val = res.data[0].value;
    return typeof val === 'string' ? JSON.parse(val) : val;
  } catch(e){
    var loc = localStorage.getItem(key);
    return loc ? JSON.parse(loc) : defVal;
  }
}

async function saveStorageData(key, val){
  try {
    localStorage.setItem(key, JSON.stringify(val));
    var sb = (typeof _getSupabase === 'function') ? _getSupabase() : (typeof supabase !== 'undefined' ? supabase : null);
    if(sb){
      await sb.from('設定').upsert({ key: key, value: JSON.stringify(val) }, { onConflict: 'key' });
    }
  } catch(e){
    console.warn('saveStorageData error:', e);
  }
}

// ─── 受講モーダルを開く ─────────────────────────────────
function openTrainingModal(courseId){

  if(!_curTraining) return;

  _quizStep = 0;
  _quizAnswers = {};

  el('modal-training-title').textContent = _curTraining.title;

  el('training-modal-overlay').classList.add('active');
}

function closeTrainingModal(){
  el('training-modal-overlay').classList.remove('active');
}

// ─── モーダル内ステップ描画 ─────────────────────────────
function renderModalStep(){
  var body = el('modal-training-body');
  if(!body || !_curTraining) return;

  var h = '';

  // 1. 動画プレイヤー
  h += '<div class="video-wrapper">';
  h += '  <iframe src="' + _curTraining.videoEmbedUrl + '" title="' + esc(_curTraining.title) + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
  h += '</div>';

  // 2. 要点まとめスライド
  if(_curTraining.keypoints && _curTraining.keypoints.length > 0){
    h += '<div class="keypoints-box">';
    h += '  <div class="keypoints-title">💡 本日の研修重要ポイント（要約）</div>';
    h += '  <ul class="keypoints-list">';
    _curTraining.keypoints.forEach(function(kp){
      h += '    <li>' + kp + '</li>';
    });
    h += '  </ul>';
    h += '</div>';
  }

  // 3. 理解度チェッククイズ
  if(_curTraining.quizzes && _curTraining.quizzes.length > 0){
    h += '<div class="section-title"><span>📝 理解度確認ミニクイズ（全' + _curTraining.quizzes.length + '問）</span></div>';
    h += '<p style="font-size:12.5px;color:var(--sub);margin-bottom:14px;">動画の要点を振り返り、正しいと思う選択肢をタップしてください。合格基準：80点以上</p>';

    _curTraining.quizzes.forEach(function(q, idx){
      var myAns = _quizAnswers[idx];
      var isAnswered = (myAns !== undefined);

      h += '<div class="quiz-step-card">';
      h += '  <div class="quiz-q-num">第 ' + (idx + 1) + ' 問</div>';
      h += '  <div class="quiz-q-text">' + esc(q.q) + '</div>';
      h += '  <div class="quiz-choices">';
      q.choices.forEach(function(choice, cIdx){
        var btnClass = 'choice-btn';
        if(isAnswered){
          if(cIdx === q.ans) btnClass += ' selected-correct';
          else if(cIdx === myAns) btnClass += ' selected-wrong';
        }
        var icon = isAnswered && cIdx === q.ans ? ' ✓ 正解' : '';
        h += '    <button type="button" class="' + btnClass + '" onclick="answerQuiz(' + idx + ', ' + cIdx + ')">' +
          '<span>' + esc(choice) + '</span>' +
          '<span>' + icon + '</span>' +
        '</button>';
      });
      h += '  </div>';

      // 解説
      var expDisplay = isAnswered ? 'block' : 'none';
      h += '  <div class="quiz-explanation" style="display:' + expDisplay + ';">' + esc(q.exp) + '</div>';
      h += '</div>';
    });
  }

  // 4. 所感入力
  h += '<div class="quiz-step-card reflection-box">';
  h += '  <label>✍️ 本日の所感・現場で意識したいこと（ひと言）</label>';
  h += '  <textarea id="f-training-reflection" class="reflection-textarea" rows="3" placeholder="例：作業を焦らせず、具体的な時間を伝えて安心していただけるよう心がけます。"></textarea>';
  h += '  <div class="quick-chips">';
  ['具体的な時間と見通しを伝える', '行動の背景にある理由に気づく', '「ちょっと待って」を減らす', 'チームで声かけを振り返る'].forEach(function(txt){
    h += '    <span class="quick-chip" onclick="addReflectionSnippet(\'' + txt + '\')">' + txt + '</span>';
  });
  h += '  </div>';
  h += '</div>';

  // 5. 保存完了ボタン
  h += '<button type="button" class="training-start-btn" style="background:#2e7d32;margin-top:16px;" onclick="submitTrainingCompletion()">';
  h += '  <span>💾 理解度テストと所感を提出し、受講完了にする</span>';
  h += '</button>';

  body.innerHTML = h;
}

function addReflectionSnippet(txt){
  var tf = el('f-training-reflection');
  if(!tf) return;
  if(tf.value) tf.value += '、' + txt;
  else tf.value = txt;
}

function answerQuiz(qIdx, choiceIdx){
  _quizAnswers[qIdx] = choiceIdx;
  renderModalStep();
}

// ─── 受講完了の保存 ─────────────────────────────────────
async function submitTrainingCompletion(){
  if(!_curStaff){
    alert('受講スタッフが選択されていません。');
    return;
  }
  if(!_curTraining){
    return;
  }

  // 全問回答チェック
  var total = _curTraining.quizzes.length;
  var answeredCount = Object.keys(_quizAnswers).length;
  if(answeredCount < total){
    alert('まだ回答していない問題があります。全問回答してください。');
    return;
  }

  // 採点
  var correctCount = 0;
  _curTraining.quizzes.forEach(function(q, idx){
    if(_quizAnswers[idx] === q.ans) correctCount++;
  });
  var score = Math.round((correctCount / total) * 100);

  if(score < 75){
    alert('得点が ' + score + '点 でした。合格基準は75点以上です。解説を確認して再度挑戦してください！');
    return;
  }

  var reflection = el('f-training-reflection') ? el('f-training-reflection').value.trim() : '';

  var record = {
    id: 'tr_rec_' + Date.now(),
    trainingId: _curTraining.id,
    trainingTitle: _curTraining.title,
    staffId: _curStaff.id,
    staffName: _curStaff.name,
    staffRole: _curStaff.role,
    completedDate: todayStr(),
    score: score,
    total: total,
    correctCount: correctCount,
    reflection: reflection || 'スピーチロックを避け、見通しをもった丁寧な支援を実践します。',
    submittedAt: new Date().toISOString()
  };

  // 既存の同一研修レコードがあれば上書き、なければ先頭追加
  var existIdx = _trainingRecords.findIndex(function(r){
    return r.staffId === _curStaff.id && r.trainingId === _curTraining.id;
  });
  if(existIdx >= 0){
    _trainingRecords[existIdx] = record;
  } else {
    _trainingRecords.unshift(record);
  }

  await saveStorageData('porte_training_records', _trainingRecords);

  alert('🎉 合格おめでとうございます！\n得点: ' + score + '点（' + correctCount + '/' + total + '）\n受講完了として記録簿に保存されました。');

  closeTrainingModal();
  renderStaffGrid();
  renderStaffTrainingList();
  renderAdminMatrix();
}

  h += '<th style="width:100px;">役職</th>';
  TRAINING_COURSES.forEach(function(tc){
    h += '<th>' + tc.month + '<br><span style="font-size:11px;font-weight:normal;">' + esc(tc.category) + '</span></th>';
  });
  h += '<th style="width:90px;">年間進捗</th>';
  h += '</tr></thead><tbody>';

  STAFF.forEach(function(s){
    var myRecs = _trainingRecords.filter(function(r){ return r.staffId === s.id; });
    var doneCnt = myRecs.length;
    var totalCnt = TRAINING_COURSES.length;
    var pct = Math.round((doneCnt / totalCnt) * 100);

    h += '<tr>';
    h += '<td class="staff-col"><b>' + esc(s.name) + '</b></td>';
    h += '<td><span style="font-size:11px;color:var(--sub);">' + esc(s.role) + '</span></td>';

    TRAINING_COURSES.forEach(function(tc){
      var rec = myRecs.find(function(r){ return r.trainingId === tc.id; });
      if(rec){
        h += '<td><span class="badge-ok">✓ 済 (' + rec.score + '点)</span><div style="font-size:10px;color:#666;margin-top:2px;">' + rec.completedDate + '</div></td>';
      } else if(tc.isCurrent){
        h += '<td><span class="badge-no">⏳ 未受講</span></td>';
      } else {
        h += '<td><span style="color:#bbb;font-size:11px;">予定</span></td>';
      }
    });

    h += '<td><b style="color:' + (pct === 100 ? 'var(--grn)' : 'var(--accent)') + ';">' + pct + '%</b> (' + doneCnt + '/' + totalCnt + ')</td>';
    h += '</tr>';
  });

  h += '</tbody>';
  c.innerHTML = h;
}

// ─── 委員会議事録アーカイブ描画 ─────────────────────────
function renderCommitteeList(){
  var c = el('committee-minutes-list');
  if(!c) return;

  if(_committeeMinutes.length === 0){
    c.innerHTML = '<div style="text-align:center;padding:24px;color:var(--sub);font-size:13px;">まだ登録された委員会議事録はありません。「身体拘束適正化 委員会議事録を作成」から作成できます。</div>';
    return;
  }

  c.innerHTML = _committeeMinutes.map(function(cm){
    return '<div style="background:#faf6f2;border:1px solid var(--bdr);border-radius:12px;padding:12px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">' +
      '<div>' +
        '<span style="font-size:11px;font-weight:bold;background:#2e7d32;color:#fff;padding:2px 8px;border-radius:8px;">' + esc(cm.category) + '</span>' +
        '<span style="font-weight:bold;margin-left:8px;">' + esc(cm.title) + '</span>' +
        '<div style="font-size:12px;color:var(--sub);margin-top:4px;">開催日: ' + cm.date + ' | 出席者: ' + esc(cm.attendees) + '</div>' +
      '</div>' +
      '<button type="button" class="btn-print" style="font-size:12px;padding:6px 12px;" onclick="printCommitteeMinutes(\'' + cm.id + '\')">🖨️ 議事録を印刷</button>' +
    '</div>';
  }).join('');
}

function closeCommitteeModal(){
  el('committee-modal-overlay').classList.remove('active');
}

async function saveCommitteeMinutes(){
  var date = el('cm-date').value || todayStr();
  var title = el('cm-title').value || '身体拘束適正化 委員会議事録';
  var attendees = el('cm-attendees').value || '';
  var agenda = el('cm-agenda').value || '';
  var decisions = el('cm-decisions').value || '';

  var cm = {
    id: 'cm_' + Date.now(),
    category: '身体拘束適正化委員会',
    date: date,
    title: title,
    attendees: attendees,
    agenda: agenda,
    decisions: decisions,
    createdAt: new Date().toISOString()
  };

  _committeeMinutes.unshift(cm);
  await saveStorageData('porte_committee_minutes', _committeeMinutes);

  closeCommitteeModal();
  renderCommitteeList();
  alert('委員会議事録を保存しました。実地指導用A4印刷が可能です。');
}
