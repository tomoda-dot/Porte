<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>マイページ | ひとつぎ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--pri:#3d5a3e;--bg:#f7f4f0;--card:#fff;--bdr:#e0d6cf;--sub:#8a7a6a;--grn:#2e7d32;--paid:#1565c0;--paid-am:#1976d2;--paid-pm:#0288d1;}
body{font-family:sans-serif;background:var(--bg);color:#333;min-height:100vh;font-size:14px;}
/* ログイン */
#pg-login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-box{background:#fff;border-radius:16px;padding:32px 24px;width:100%;max-width:360px;box-shadow:0 4px 20px rgba(0,0,0,.1);}
.login-logo{text-align:center;margin-bottom:24px;}
.login-logo .ico{font-size:40px;display:block;}
.login-logo h1{font-size:18px;font-weight:700;color:var(--pri);margin-top:8px;}
.f label{display:block;font-size:11px;font-weight:700;color:var(--sub);margin-bottom:4px;margin-top:12px;}
.f input{width:100%;padding:11px 12px;border:1.5px solid var(--bdr);border-radius:8px;font-size:15px;}
#btn-login{width:100%;padding:14px;background:var(--pri);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;margin-top:16px;}
#login-err{color:#c62828;font-size:12px;text-align:center;margin-top:8px;min-height:16px;}
/* メイン */
#pg-main{display:none;max-width:680px;margin:0 auto;padding:12px;}
#pg-loading{display:none;text-align:center;padding:60px 20px;color:var(--sub);}
.spin{width:28px;height:28px;border:3px solid var(--bdr);border-top-color:var(--pri);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 10px;}
@keyframes sp{to{transform:rotate(360deg);}}
header{background:var(--pri);color:#fff;padding:12px 16px;border-radius:12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
.hd-name{font-size:17px;font-weight:700;}
.hd-role{font-size:11px;opacity:.8;margin-top:2px;}
#btn-logout{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 12px;border-radius:16px;font-size:12px;cursor:pointer;}
/* カード */
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,.05);}
.ct{font-size:11px;font-weight:700;color:var(--sub);margin-bottom:10px;}
/* タイムカード */
.tc-rec{display:flex;justify-content:space-between;padding:8px 10px;border-radius:8px;margin-bottom:6px;font-size:14px;}
.tc-rec.in{background:#e8f5e8;color:var(--grn);}
.tc-rec.out{background:#fce8e8;color:#c62828;}
.tc-btn{width:100%;padding:15px;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;color:#fff;margin-bottom:6px;}
.tc-btn.in{background:var(--grn);}
.tc-btn.out{background:#c62828;}
/* タブ */
.tabs{display:flex;border-bottom:2px solid var(--bdr);margin-bottom:12px;}
.tb{flex:1;padding:9px 2px;border:none;background:none;font-size:12px;font-weight:700;cursor:pointer;color:#aaa;border-bottom:3px solid transparent;margin-bottom:-2px;}
.tb.on{color:var(--pri);border-bottom-color:var(--pri);}
/* テーブル系 */
.rows .row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f0ebe5;cursor:pointer;}
.rows .row:last-child{border-bottom:none;}
.row-l{color:var(--sub);font-size:12px;}
.row-r{font-weight:600;display:flex;align-items:center;gap:4px;}
.arr{color:#ccc;font-size:12px;}
/* パターンバッジ */
.pat{display:inline-block;padding:2px 8px;border-radius:8px;color:#fff;font-size:11px;font-weight:700;}
/* サマリー */
.sum3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;}
.sum-i{background:var(--bg);border-radius:8px;padding:10px;text-align:center;}
.sum-i .v{font-size:20px;font-weight:700;color:var(--pri);}
.sum-i .l{font-size:10px;color:var(--sub);margin-top:2px;}
/* 有給 */
.pl-big{text-align:center;padding:12px 0 16px;}
.pl-big .n{font-size:48px;font-weight:700;color:var(--paid);}
.pl-big .u{font-size:16px;color:var(--paid);}
/* 申請 */
.type-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px;}
.type-btn{padding:9px 4px;border:2px solid var(--bdr);border-radius:8px;background:#fff;color:var(--sub);font-size:12px;font-weight:700;cursor:pointer;}
.type-btn.on{border-color:var(--paid);background:var(--paid);color:#fff;}
.sub-btn{width:100%;padding:13px;background:var(--pri);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;}
.plr-i{border-left:4px solid var(--bdr);padding:10px 12px;border-radius:0 8px 8px 0;margin-bottom:8px;background:#fafafa;}
.plr-i.pending{border-color:#e65100;background:#fff8f0;}
.plr-i.approved{border-color:var(--grn);background:#f0fff0;}
.plr-i.rejected{border-color:#c62828;background:#fff0f0;}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;display:inline-block;}
.badge.pending{background:#fff3e0;color:#e65100;}
.badge.approved{background:#e8f5e8;color:var(--grn);}
.badge.rejected{background:#fce8e8;color:#c62828;}
/* モーダル */
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:16px;}
.modal-box{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto;}
.modal-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.modal-hd h3{font-size:16px;font-weight:700;}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:#aaa;}
.mf label{display:block;font-size:11px;font-weight:700;color:var(--sub);margin-bottom:4px;margin-top:12px;}
.mf input,.mf select,.mf textarea{width:100%;padding:10px;border:1.5px solid var(--bdr);border-radius:8px;font-size:14px;}
.mf textarea{resize:none;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
</style>
</head>
<body>

<div id="pg-loading"><div class="spin"></div>読み込み中...</div>

<div id="pg-login">
  <div class="login-box">
    <div class="login-logo">
      <span class="ico">🏢</span>
      <h1>ひとつぎ マイページ</h1>
    </div>
    <div class="f">
      <label>ログインID</label>
      <input type="text" id="inp-id" autocomplete="username">
    </div>
    <div class="f">
      <label>パスワード</label>
      <input type="password" id="inp-pw" autocomplete="current-password">
    </div>
    <button id="btn-login">ログイン</button>
    <div id="login-err"></div>
  </div>
</div>

<div id="pg-main">
  <header>
    <div>
      <div class="hd-name" id="hd-name"></div>
      <div class="hd-role" id="hd-role"></div>
    </div>
    <button id="btn-logout">ログアウト</button>
  </header>

  <!-- タイムカード -->
  <div class="card" id="tc-card">
    <div class="ct">🕐 タイムカード — <span id="tc-date"></span></div>
    <div id="tc-body"></div>
  </div>

  <!-- タブ -->
  <div class="tabs">
    <button class="tb on" id="tb-shift" onclick="showTab('shift')">📆 シフト</button>
    <button class="tb" id="tb-att" onclick="showTab('att')">📊 出勤</button>
    <button class="tb" id="tb-paid" onclick="showTab('paid')">📅 有給</button>
    <button class="tb" id="tb-reqs" style="display:none;" onclick="showTab('reqs')">📋 申請履歴</button>
  </div>

  <div id="tab-shift">
    <div class="card">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <button onclick="shiftPrev()" style="border:1px solid var(--bdr);background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px">◀</button>
        <span id="shift-ym" style="flex:1;text-align:center;font-size:15px;font-weight:700"></span>
        <button onclick="shiftNext()" style="border:1px solid var(--bdr);background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px">▶</button>
        <button onclick="shiftNow()" style="border:1px solid var(--bdr);background:#fff;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:11px">今月</button>
      </div>
      <div id="shift-body" class="rows"></div>
    </div>
    <div class="card" id="my-shift-reqs-card">
      <div class="ct">📋 自分のシフト変更・勤怠修正 申請履歴</div>
      <div id="my-shift-reqs-list"></div>
    </div>
  </div>

  <div id="tab-att" style="display:none">
    <div class="card">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <button onclick="attPrev()" style="border:1px solid var(--bdr);background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px">◀</button>
        <span id="att-ym" style="flex:1;text-align:center;font-size:15px;font-weight:700"></span>
        <button onclick="attNext()" style="border:1px solid var(--bdr);background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px">▶</button>
        <button onclick="attNow()" style="border:1px solid var(--bdr);background:#fff;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:11px">今月</button>
      </div>
      <div class="sum3" id="att-sum"></div>
      <div id="att-body" class="rows"></div>
    </div>
  </div>

  <div id="tab-paid" style="display:none">
    <div class="card">
      <div class="ct">📅 有給残日数</div>
      <div class="pl-big"><span class="n" id="pl-num">-</span><span class="u">日</span></div>
    </div>
    <div class="card">
      <div class="ct">📨 有給申請</div>
      <div class="f"><label>取得日</label><input type="date" id="plr-date"></div>
      <div class="f" style="margin-top:10px"><label>種別</label>
        <div class="type-btns">
          <button class="type-btn on" onclick="setType(this,'有給')">全日</button>
          <button class="type-btn" onclick="setType(this,'午前半休')">午前半休</button>
          <button class="type-btn" onclick="setType(this,'午後半休')">午後半休</button>
        </div>
      </div>
      <div class="f"><label>理由（任意）</label><input type="text" id="plr-reason" placeholder="例: 私用のため"></div>
      <button class="sub-btn" id="btn-plr">申請する</button>
    </div>
    <div class="card">
      <div class="ct">📋 申請状況</div>
      <div id="plr-list"></div>
    </div>
    <div class="card">
      <div class="ct">📋 付与履歴</div>
      <div id="pl-grants"></div>
    </div>
    <div class="card">
      <div class="ct">📝 取得履歴</div>
      <div id="pl-used"></div>
    </div>
  </div>

  <!-- 申請履歴タブ（友田アカウント専用） -->
  <div id="tab-reqs" style="display:none">
    <div class="sum3" id="reqs-sum"></div>
    <div class="card" style="padding:12px 16px;margin-bottom:10px;">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <span style="font-weight:700;font-size:12px;color:var(--sub)">絞り込み:</span>
        <select id="req-filter-staff" onchange="renderAdminReqs()" style="padding:6px 10px;border-radius:6px;border:1px solid var(--bdr);font-size:12px;">
          <option value="">全スタッフ</option>
        </select>
        <select id="req-filter-type" onchange="renderAdminReqs()" style="padding:6px 10px;border-radius:6px;border:1px solid var(--bdr);font-size:12px;">
          <option value="all">全申請種別</option>
          <option value="shift">📆 シフト変更申請</option>
          <option value="paid">📅 有給申請</option>
          <option value="attendance">📊 勤怠修正申請</option>
        </select>
        <select id="req-filter-status" onchange="renderAdminReqs()" style="padding:6px 10px;border-radius:6px;border:1px solid var(--bdr);font-size:12px;">
          <option value="all">全ステータス</option>
          <option value="pending" selected>承認待ち</option>
          <option value="approved">承認済み</option>
          <option value="rejected">却下</option>
        </select>
      </div>
    </div>
    <div class="card">
      <div class="ct" style="display:flex;justify-content:space-between;align-items:center;">
        <span>📋 全スタッフの申請一覧</span>
        <button onclick="loadAdminReqs()" style="background:none;border:1px solid var(--bdr);padding:3px 8px;border-radius:6px;font-size:11px;cursor:pointer;">🔄 更新</button>
      </div>
      <div id="admin-reqs-list"></div>
    </div>
  </div>
</div>

<!-- モーダル -->
<div id="modal">
  <div class="modal-box">
    <div class="modal-hd">
      <h3 id="modal-title"></h3>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div id="modal-body" class="mf"></div>
  </div>
</div>

<script>
'use strict';
// ─── 初期化 ─────────────────────────
var SB = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
var ME = null, PATS = [], PL_USAGES = [], PL_GRANTS = [], PLR_LIST = [];
var PLR_TYPE = '有給', SHIFT_YM = '', ATT_YM = '', TC_REC = null;
var ALL_STAFF = [], ADMIN_SHIFT_REQS = [], ADMIN_PAID_REQS = [], MY_SHIFT_REQS = [];

function isTomoda(staff){
  if(!staff) return false;
  var n = String(staff.name || '');
  var l = String(staff.loginId || '');
  var r = String(staff.role || '');
  return n.indexOf('友田') >= 0 || l.toLowerCase().indexOf('tomoda') >= 0 || r === '管理者';
}

// ─── ユーティリティ ──────────────────
function pad(n){ return String(n).padStart(2,'0'); }
function today(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function nowYM(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function nowTime(){ var d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtD(s){ if(!s)return'-'; var p=s.split('-'); return p[0]+'/'+p[1]+'/'+p[2]; }
function fmtYM(ym){ var p=ym.split('-'); return p[0]+'年'+parseInt(p[1])+'月'; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function show(id){ document.getElementById(id).style.display='block'; }
function hide(id){ document.getElementById(id).style.display='none'; }
function flex(id){ document.getElementById(id).style.display='flex'; }
function el(id){ return document.getElementById(id); }
function qsa(sel){ return document.querySelectorAll(sel); }
var DOW = ['日','月','火','水','木','金','土'];

// テーブルが存在しない場合も空配列で返す安全クエリ
async function safeQuery(promise){
  try{ var r = await promise; return (r && r.data) ? r.data : []; }
  catch(e){ return []; }
}

// 不明カラム自動除外付き安全insert
async function safeInsert(table, obj){
  var safe = Object.assign({}, obj);
  for(var retry = 0; retry < 10; retry++){
    var r = await SB.from(table).insert([safe]).select();
    if(!r.error) return r;
    if(r.error.message && r.error.message.indexOf('Could not find the') >= 0){
      var m = r.error.message.match(/find the '([^']+)'/);
      if(m){
        delete safe[m[1]];
        continue;
      }
    }
    throw r.error;
  }
  throw new Error('Insert failed');
}

// ─── 有給計算 ────────────────────────
var PL_TBL=[{m:6,d:10},{m:18,d:11},{m:30,d:12},{m:42,d:14},{m:54,d:16},{m:66,d:18},{m:78,d:20}];
var PL_PT={4:[7,8,9,10,12,13,15],3:[5,6,6,8,9,10,11],2:[3,4,4,5,6,6,7],1:[1,2,2,2,3,3,3]};

function grantDays(i,wd){ var w=Number(wd)||0; if(w>=1&&w<=4&&PL_PT[w])return PL_PT[w][i]; return PL_TBL[i].d; }

function buildGrants(s){
  if(!s||!s.startDate)return[];
  var res=[],steps=[6,18,30,42,54,66,78],sd=new Date(s.startDate),td=today();
  for(var i=0;i<steps.length;i++){
    var gd=new Date(sd); gd.setMonth(gd.getMonth()+steps[i]);
    var gs=gd.getFullYear()+'-'+pad(gd.getMonth()+1)+'-'+pad(gd.getDate());
    var ed=new Date(gd); ed.setFullYear(ed.getFullYear()+2);
    var es=ed.getFullYear()+'-'+pad(ed.getMonth()+1)+'-'+pad(ed.getDate());
    res.push({grantDate:gs,days:grantDays(i,s.weeklyDays),expDate:es,isFuture:gs>td,isExpired:es<td});
    if(i===6){
      for(var j=1;j<=5;j++){
        var ng=new Date(gd); ng.setFullYear(ng.getFullYear()+j);
        var ngs=ng.getFullYear()+'-'+pad(ng.getMonth()+1)+'-'+pad(ng.getDate());
        var ne=new Date(ng); ne.setFullYear(ne.getFullYear()+2);
        res.push({grantDate:ngs,days:20,expDate:ne.getFullYear()+'-'+pad(ne.getMonth()+1)+'-'+pad(ne.getDate()),isFuture:ngs>td,isExpired:false});
      }
      break;
    }
  }
  return res;
}

function calcBal(grants,usages){
  var b=0;
  grants.forEach(function(g){
    if(g.isFuture||g.isExpired)return;
    var u=usages.reduce(function(s,x){return x.grantId===g.grantDate?s+(Number(x.days)||0):s;},0);
    b+=Math.max(0,g.days-u);
  });
  return b;
}

// ─── ログイン ────────────────────────
el('btn-login').onclick = async function(){
  var id=el('inp-id').value.trim(), pw=el('inp-pw').value;
  var err=el('login-err'), btn=this;
  err.textContent='';
  if(!id||!pw){err.textContent='IDとパスワードを入力してください';return;}
  btn.disabled=true; btn.textContent='確認中...';
  try{
    var r=await SB.from('スタッフ').select('*').eq('loginId',id).eq('password',pw).limit(1);
    if(r.error)throw r.error;
    if(!r.data||!r.data.length){err.textContent='IDまたはパスワードが違います';return;}
    ME=r.data[0];
    try{sessionStorage.setItem('mp',JSON.stringify(ME));}catch(e){}
    await boot();
  }catch(e){
    err.textContent='エラー: '+(e.message||String(e));
  }finally{
    btn.disabled=false; btn.textContent='ログイン';
  }
};

el('inp-pw').onkeydown=function(e){if(e.key==='Enter')el('btn-login').onclick();};

el('btn-logout').onclick=function(){
  try{sessionStorage.removeItem('mp');}catch(e){}
  ME=null;
  hide('pg-main'); flex('pg-login');
};

// ─── 起動 ────────────────────────────
async function boot(){
  hide('pg-login'); hide('pg-main');
  show('pg-loading');
  try{
    // 勤務パターン
    var r1=await SB.from('設定').select('value').eq('key','shiftPatterns').limit(1);
    try{PATS=JSON.parse((r1.data&&r1.data[0]&&r1.data[0].value)||'[]');}catch(e){PATS=[];}
    // 有給取得記録
    PL_USAGES=await safeQuery(SB.from('有給取得記録').select('*').eq('staffId',ME.id));
    // 付与履歴
    PL_GRANTS=buildGrants(ME);
    // 有給申請 (自分)
    PLR_LIST=await safeQuery(SB.from('有給申請').select('*').eq('staffId',ME.id).order('createdAt',{ascending:false}));
    // シフト変更申請 (自分)
    MY_SHIFT_REQS=await safeQuery(SB.from('変更申請').select('*').eq('staffId',ME.id).order('createdAt',{ascending:false}));
    
    // 画面設定
    el('hd-name').textContent=ME.name||'';
    el('hd-role').textContent=ME.role||'';
    SHIFT_YM=nowYM(); ATT_YM=nowYM();
    hide('pg-loading'); show('pg-main');
    await loadTC();
    await renderShift();
    renderMyShiftReqs();
    var di=el('plr-date'); if(di)di.value=today();

    // 友田アカウントチェック（管理者特権）
    if(isTomoda(ME)){
      el('tb-reqs').style.display='inline-block';
      await loadAdminReqs();
    }else{
      el('tb-reqs').style.display='none';
    }
  }catch(e){
    hide('pg-loading'); flex('pg-login');
    alert('読み込みエラー: '+(e.message||String(e)));
  }
}

// セッション復元
(async function(){
  try{
    var s=sessionStorage.getItem('mp');
    if(s){ME=JSON.parse(s); await boot();}
  }catch(e){try{sessionStorage.removeItem('mp');}catch(e2){}}
})();

// ─── タブ ────────────────────────────
function showTab(tab){
  ['shift','att','paid','reqs'].forEach(function(t){
    var tabEl=document.getElementById('tab-'+t);
    var tbEl=document.getElementById('tb-'+t);
    if(tabEl) tabEl.style.display=t===tab?'block':'none';
    if(tbEl) tbEl.className='tb'+(t===tab?' on':'');
  });
  if(tab==='att')renderAtt();

async function clockIn(){

async function clockOut(){

// 退職チェック
function isStaffActive(s, ym){
  var td = today();
  var checkYM = ym || td.substring(0,7);
  if(s.startDate){
    var stYM = s.startDate.substring(0,7);
    if(checkYM < stYM) return false;
  }
  if(!s.endDate) return true;
  var endYM = s.endDate.substring(0,7);
  if(s.endDate < td || checkYM > endYM) return false;
  return true;
}

// ─── 管理者・全申請履歴処理（友田専用） ──────────────────
async function loadAdminReqs(){
  if(!isTomoda(ME)) return;
  var sRes=await safeQuery(SB.from('スタッフ').select('*'));
  ALL_STAFF=sRes||[];
  var sel=el('req-filter-staff');
  if(sel){
    var curVal=sel.value;
    var activeStaff = ALL_STAFF.filter(function(s){ return isStaffActive(s); });
    var retiredStaff = ALL_STAFF.filter(function(s){ return !isStaffActive(s); });

    var opts = '<option value="">全スタッフ（在籍中）</option>';
    activeStaff.forEach(function(s){
      opts += '<option value="'+s.id+'">'+esc(s.name)+'</option>';
    });
    if(retiredStaff.length > 0){
      opts += '<option value="" disabled>── 退職済み ──</option>';
      retiredStaff.forEach(function(s){
        opts += '<option value="'+s.id+'">'+esc(s.name)+' (退職)</option>';
      });
    }
    sel.innerHTML=opts;
    sel.value=curVal;
  }
  ADMIN_SHIFT_REQS=await safeQuery(SB.from('変更申請').select('*').order('createdAt',{ascending:false}));
  ADMIN_PAID_REQS=await safeQuery(SB.from('有給申請').select('*').order('createdAt',{ascending:false}));
  renderAdminReqs();
}

function staffNameById(staffId){
  var s=ALL_STAFF.find(function(x){return x.id===staffId;});
  if(!s) return 'スタッフ('+staffId+')';
  return s.name + (!isStaffActive(s) ? ' (退職)' : '');
}

function renderAdminReqs(){
  if(!isTomoda(ME)) return;
  var filterStaff=el('req-filter-staff')?el('req-filter-staff').value:'';
  var filterType=el('req-filter-type')?el('req-filter-type').value:'all';
  var filterStatus=el('req-filter-status')?el('req-filter-status').value:'pending';

  var list=[];

  if(filterType==='all'||filterType==='shift'||filterType==='attendance'){
    ADMIN_SHIFT_REQS.forEach(function(r){
      if(filterType==='shift'&&r.type!=='shift') return;
      if(filterType==='attendance'&&r.type!=='attendance') return;
      list.push({
        source: 'change_request',
        id: r.id,
        staffId: r.staffId,
        type: r.type || 'shift',
        date: r.date,
        requestData: r.requestData,
        reason: r.reason || '',
        status: r.status || 'pending',
        comment: r.comment || '',
        createdAt: r.createdAt || ''
      });
    });
  }

  if(filterType==='all'||filterType==='paid'){
    ADMIN_PAID_REQS.forEach(function(r){
      list.push({
        source: 'paid_request',
        id: r.id,
        staffId: r.staffId,
        type: 'paid',
        paidType: r.type || '有給',
        date: r.date,
        reason: r.reason || '',
        status: r.status || 'pending',
        comment: r.comment || '',
        createdAt: r.createdAt || ''
      });
    });
  }

  list.sort(function(a,b){return (b.createdAt||'').localeCompare(a.createdAt||'');});

  if(filterStaff){
    list=list.filter(function(r){return r.staffId===filterStaff;});
  }
  if(filterStatus!=='all'){
    list=list.filter(function(r){return r.status===filterStatus;});
  }

  var pendingCnt = list.filter(function(r){return r.status==='pending';}).length;
  var shiftCnt = list.filter(function(r){return r.source==='change_request';}).length;
  var paidCnt = list.filter(function(r){return r.source==='paid_request';}).length;

  var sumEl=el('reqs-sum');
  if(sumEl){
    sumEl.innerHTML=
      '<div class="sum-i"><div class="v" style="color:#e65100">'+pendingCnt+'</div><div class="l">承認待ち</div></div>'+
      '<div class="sum-i"><div class="v">'+shiftCnt+'</div><div class="l">シフト/勤怠申請</div></div>'+
      '<div class="sum-i"><div class="v">'+paidCnt+'</div><div class="l">有給申請</div></div>';
  }

  var b=el('admin-reqs-list');
  if(!b) return;
  if(!list.length){
    b.innerHTML='<p style="color:var(--sub);text-align:center;padding:20px">該当する申請履歴がありません</p>';
    return;
  }

  var html='';
  list.forEach(function(r){
    var sName=staffNameById(r.staffId);
    var sl=r.status==='pending'?'承認待ち':r.status==='approved'?'承認済み':'却下';
    var typeTitle='', typeBadgeBg='#3d5a3e';
    var detailText='';

    if(r.source==='paid_request'){
      typeTitle='📅 有給申請';
      typeBadgeBg='#1565c0';
      var tl=r.paidType==='有給'?'全日':r.paidType==='午前半休'?'午前半休':'午後半休';
      detailText='種別: <b>'+tl+'</b>';
    }else if(r.type==='shift'){
      typeTitle='📆 シフト変更申請';
      typeBadgeBg='#c07830';
      var reqPattern='';
      try{
        var d=typeof r.requestData==='string'?JSON.parse(r.requestData):r.requestData;
        reqPattern=d.requestedPattern||'';
      }catch(e){}
      detailText='希望シフト: <b style="color:var(--pri)">'+esc(reqPattern||'指定あり')+'</b>';
    }else{
      typeTitle='📊 勤怠修正申請';
      typeBadgeBg='#2e7d32';
      var st='',et='',brk='';
      try{
        var d2=typeof r.requestData==='string'?JSON.parse(r.requestData):r.requestData;
        st=d2.startTime||''; et=d2.endTime||''; brk=d2.breakMin||'';
      }catch(e){}
      detailText='修正時間: <b>'+esc(st)+'〜'+esc(et)+'</b> (休憩'+esc(brk)+'分)';
    }

    var reqReason = r.reason || '';
    if(!reqReason && r.requestData){
      try{
        var dObj = typeof r.requestData === 'string' ? JSON.parse(r.requestData) : r.requestData;
        if(dObj && dObj.reason) reqReason = dObj.reason;
      }catch(e){}
    }

    var createdFmt = r.createdAt ? new Date(r.createdAt).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';

    html+='<div class="plr-i '+r.status+'" style="margin-bottom:10px;padding:12px;">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">'+
        '<div><span class="pat" style="background:'+typeBadgeBg+';margin-right:6px;">'+typeTitle+'</span><b>'+esc(sName)+'</b></div>'+
        '<span class="badge '+r.status+'">'+sl+'</span>'+
      '</div>'+
      '<div style="font-size:13px;margin:4px 0;">対象日: <b>'+fmtD(r.date)+'</b> ｜ '+detailText+'</div>'+
      (reqReason?'<div style="font-size:12px;color:#333;margin-top:6px;background:#f5f0ea;padding:6px 10px;border-radius:6px;">💬 <b>申請メッセージ:</b> '+esc(reqReason)+'</div>':'')+
      (r.comment?'<div style="font-size:12px;color:#c62828;margin-top:4px;background:rgba(0,0,0,0.03);padding:4px 8px;border-radius:4px;">コメント: '+esc(r.comment)+'</div>':'')+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:6px;border-top:1px dashed #eee;font-size:11px;color:#999;">'+
        '<span>申請日時: '+createdFmt+'</span>'+
        (r.status==='pending'?
          '<div>'+
            '<button onclick="approveAdminReq(\''+r.source+'\',\''+r.id+'\')" style="background:var(--grn);color:#fff;border:none;border-radius:6px;padding:4px 12px;font-size:11px;font-weight:700;cursor:pointer;margin-right:6px;">✅ 承認</button>'+
            '<button onclick="rejectAdminReq(\''+r.source+'\',\''+r.id+'\')" style="background:#c62828;color:#fff;border:none;border-radius:6px;padding:4px 12px;font-size:11px;font-weight:700;cursor:pointer;">❌ 却下</button>'+
          '</div>':''
        )+
      '</div>'+
    '</div>';
  });

  b.innerHTML=html;
}

// 承認処理
async function approveAdminReq(source, id){
  var comment = prompt('承認コメント（任意）:') || '';
  try{
    if(source==='paid_request'){
      var req = ADMIN_PAID_REQS.find(function(x){return x.id===id;});
      if(!req) return;
      await SB.from('有給申請').update({status:'approved', comment:comment}).eq('id',id);
      var days = req.type==='有給'?1:0.5;
      await safeInsert('有給取得記録',{id:'pl'+Date.now(), staffId:req.staffId, date:req.date, days:days, reason:req.reason||'有給申請承認'});
      var shiftPat = req.type==='有給'?'有給':req.type==='午前半休'?'有給（午前半休）':'有給（午後半休）';
      var sEx = await SB.from('シフト').select('id').eq('staffId',req.staffId).eq('date',req.date).limit(1);
      if(sEx.data && sEx.data.length>0){
        await SB.from('シフト').update({pattern:shiftPat}).eq('id',sEx.data[0].id);
      }else{
        await safeInsert('シフト',{id:'sh'+Date.now(), staffId:req.staffId, date:req.date, pattern:shiftPat});
      }
    }else{
      var req2 = ADMIN_SHIFT_REQS.find(function(x){return x.id===id;});
      if(!req2) return;
      await SB.from('変更申請').update({status:'approved', comment:comment}).eq('id',id);
      if(req2.type==='shift'){
        var reqPattern='';
        try{
          var d=typeof req2.requestData==='string'?JSON.parse(req2.requestData):req2.requestData;
          reqPattern=d.requestedPattern||'';
        }catch(e){}
        if(reqPattern){
          var sEx2 = await SB.from('シフト').select('id').eq('staffId',req2.staffId).eq('date',req2.date).limit(1);
          if(sEx2.data && sEx2.data.length>0){
            await SB.from('シフト').update({pattern:reqPattern}).eq('id',sEx2.data[0].id);
          }else{
            await safeInsert('シフト',{id:'sh'+Date.now(), staffId:req2.staffId, date:req2.date, pattern:reqPattern});
          }
        }
      }
    }
    alert('✅ 承認しました');
    await loadAdminReqs();
    await renderShift();
  }catch(e){
    alert('承認エラー: '+(e.message||e));
  }
}

// 却下処理
async function rejectAdminReq(source, id){
  var comment = prompt('却下理由・コメント（任意）:') || '';
  try{
    if(source==='paid_request'){
      await SB.from('有給申請').update({status:'rejected', comment:comment}).eq('id',id);
    }else{
      await SB.from('変更申請').update({status:'rejected', comment:comment}).eq('id',id);
    }
    alert('❌ 却下しました');
    await loadAdminReqs();
  }catch(e){
    alert('却下エラー: '+(e.message||e));
  }
}

// 自分のシフト変更申請履歴レンダー
function renderMyShiftReqs(){
  var b=el('my-shift-reqs-list');
  if(!b) return;
  if(!MY_SHIFT_REQS.length){
    b.innerHTML='<p style="color:var(--sub);text-align:center;padding:10px;font-size:12px;">申請履歴がありません</p>';
    return;
  }
  var html='';
  MY_SHIFT_REQS.forEach(function(r){
    var sl=r.status==='pending'?'承認待ち':r.status==='approved'?'承認済み':'却下';
    var tLabel=r.type==='shift'?'シフト変更':'勤怠修正';
    var info='';
    var reqReason=r.reason||'';
    try{
      var d=typeof r.requestData==='string'?JSON.parse(r.requestData):r.requestData;
      if(r.type==='shift') info='希望: <b>'+esc(d.requestedPattern||'')+'</b>';
      else info='修正: <b>'+esc(d.startTime||'')+'〜'+esc(d.endTime||'')+'</b>';
      if(!reqReason && d && d.reason) reqReason = d.reason;
    }catch(e){}
    html+='<div class="plr-i '+r.status+'" style="padding:8px 10px;margin-bottom:6px;">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;">'+
        '<span><b>'+fmtD(r.date)+'</b> <span style="font-size:11px;color:var(--sub);">('+tLabel+')</span></span>'+
        '<span class="badge '+r.status+'">'+sl+'</span>'+
      '</div>'+
      '<div style="font-size:12px;margin-top:2px;">'+info+'</div>'+
      (reqReason?'<div style="font-size:11px;color:#333;margin-top:4px;background:#f9f6f0;padding:4px 8px;border-radius:4px;">💬 <b>申請メッセージ:</b> '+esc(reqReason)+'</div>':'')+
      (r.comment?'<div style="font-size:11px;color:#c62828;margin-top:2px;">返答: '+esc(r.comment)+'</div>':'')+
    '</div>';
  });
  b.innerHTML=html;
}
</script>
