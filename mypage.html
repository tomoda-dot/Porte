<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="google" content="notranslate">
  <title>マイページ | ひとつぎ</title>
  <link rel="icon" type="image/jpeg" href="favicon-kuma.jpg">
  <link rel="apple-touch-icon" href="favicon-kuma.jpg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body,
    input,
    select,
    textarea,
    button {
      touch-action: manipulation;
    }

    input,
    select,
    textarea {
      font-size: 16px !important;
    }

    :root {
      --pri: #2d6a64;
      --bg: #f7f4f0;
      --card: #fff;
      --bdr: #e0d6cf;
      --sub: #8a7a6a;
      --grn: #2e7d32;
      --paid: #1565c0;
      --paid-am: #1976d2;
      --paid-pm: #0288d1;
    }

    body {
      font-family: sans-serif;
      background: var(--bg);
      color: #333;
      min-height: 100vh;
      font-size: 14px;
    }

    /* ログイン */
    #pg-login {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      background: #fff;
      border-radius: 16px;
      padding: 32px 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .1);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 24px;
    }

    .login-logo .ico {
      font-size: 40px;
      display: block;
    }

    .login-logo h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--pri);
      margin-top: 8px;
    }

    .f label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--sub);
      margin-bottom: 4px;
      margin-top: 12px;
    }

    .f input {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid var(--bdr);
      border-radius: 8px;
      font-size: 15px;
    }

    #btn-login {
      width: 100%;
      padding: 14px;
      background: var(--pri);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 16px;
    }

    #login-err {
      color: #c62828;
      font-size: 12px;
      text-align: center;
      margin-top: 8px;
      min-height: 16px;
    }

    /* メイン */
    #pg-main {
      display: none;
      max-width: 680px;
      margin: 0 auto;
      padding: 12px;
    }

    #pg-loading {
      display: none;
      text-align: center;
      padding: 60px 20px;
      color: var(--sub);
    }

    .spin {
      width: 28px;
      height: 28px;
      border: 3px solid var(--bdr);
      border-top-color: var(--pri);
      border-radius: 50%;
      animation: sp .8s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes sp {
      to {
        transform: rotate(360deg);
      }
    }

    header {
      background: var(--pri);
      color: #fff;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hd-name {
      font-size: 17px;
      font-weight: 700;
    }

    .hd-role {
      font-size: 11px;
      opacity: .8;
      margin-top: 2px;
    }

    #btn-logout {
      background: rgba(255, 255, 255, .2);
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 12px;
      cursor: pointer;
    }

    /* カード */
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .05);
    }

    .ct {
      font-size: 11px;
      font-weight: 700;
      color: var(--sub);
      margin-bottom: 10px;
    }

    /* タイムカード */
    .tc-rec {
      display: flex;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .tc-rec.in {
      background: #e8f5e8;
      color: var(--grn);
    }

    .tc-rec.out {
      background: #fce8e8;
      color: #c62828;
    }

    .tc-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      margin-bottom: 6px;
    }

    .tc-btn.in {
      background: var(--grn);
    }

    .tc-btn.out {
      background: #c62828;
    }

    /* タブ */
    .tabs {
      display: flex;
      border-bottom: 2px solid var(--bdr);
      margin-bottom: 12px;
    }

    .tb {
      flex: 1;
      padding: 9px 2px;
      border: none;
      background: none;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      color: #aaa;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
    }

    .tb.on {
      color: var(--pri);
      border-bottom-color: var(--pri);
    }

    /* テーブル系 */
    .rows .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid #f0ebe5;
      cursor: pointer;
    }

    .rows .row:last-child {
      border-bottom: none;
    }

    .row-l {
      color: var(--sub);
      font-size: 12px;
    }

    .row-r {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .arr {
      color: #ccc;
      font-size: 12px;
    }

    /* パターンバッジ */
    .pat {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 8px;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
    }

    /* サマリー */
    .sum3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .sum-i {
      background: var(--bg);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }

    .sum-i .v {
      font-size: 20px;
      font-weight: 700;
      color: var(--pri);
    }

    .sum-i .l {
      font-size: 10px;
      color: var(--sub);
      margin-top: 2px;
    }

    /* 有給 */
    .pl-big {
      text-align: center;
      padding: 12px 0 16px;
    }

    .pl-big .n {
      font-size: 48px;
      font-weight: 700;
      color: var(--paid);
    }

    .pl-big .u {
      font-size: 16px;
      color: var(--paid);
    }

    /* 申請 */
    .type-btns {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }

    .type-btn {
      padding: 9px 4px;
      border: 2px solid var(--bdr);
      border-radius: 8px;
      background: #fff;
      color: var(--sub);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .type-btn.on {
      border-color: var(--paid);
      background: var(--paid);
      color: #fff;
    }

    .sub-btn {
      width: 100%;
      padding: 13px;
      background: var(--pri);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    .plr-i {
      border-left: 4px solid var(--bdr);
      padding: 10px 12px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 8px;
      background: #fafafa;
    }

    .plr-i.pending {
      border-color: #e65100;
      background: #fff8f0;
    }

    .plr-i.approved {
      border-color: var(--grn);
      background: #f0fff0;
    }

    .plr-i.rejected {
      border-color: #c62828;
      background: #fff0f0;
    }

    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 8px;
      display: inline-block;
    }

    .badge.pending {
      background: #fff3e0;
      color: #e65100;
    }

    .badge.approved {
      background: #e8f5e8;
      color: var(--grn);
    }

    .badge.rejected {
      background: #fce8e8;
      color: #c62828;
    }

    /* モーダル */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-box {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-hd {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .modal-hd h3 {
      font-size: 16px;
      font-weight: 700;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #aaa;
    }

    .mf label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--sub);
      margin-bottom: 4px;
      margin-top: 12px;
    }

    .mf input,
    .mf select,
    .mf textarea {
      width: 100%;
      padding: 10px;
      border: 1.5px solid var(--bdr);
      border-radius: 8px;
      font-size: 14px;
    }

    .mf textarea {
      resize: none;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .pin-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #ccc;
      background: #fff;
      transition: all .15s ease;
    }

    .mp-staff-card {
      background: #f8f6f2;
      border: 1.5px solid var(--bdr);
      border-radius: 12px;
      padding: 14px 8px;
      text-align: center;
      cursor: pointer;
      transition: .2s;
    }

    .mp-staff-card:hover {
      border-color: var(--pri);
      transform: translateY(-2px);
    }

    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
  </style>
  <link rel="stylesheet" href="porte-login-unified.css">
  <script src="porte-auth.js"></script>
  <!-- HITOTSUGI_UNIFIED_HEADER_START -->
  <script src="hitotsugi-unified-header.js"></script>
  <script>     HitotsugiUnifiedHeader.init({       appId: 'mypage',       headerSelector: '#pg-main header',       title: '👤 ひとつぎ マイページ',       fullBleed: true,       noSubbar: true,       moveSelectors: ['#btn-chg-pw', '#hd-name'],       logoutTriggerSelector: '#hd-name',       onLogout: function () {         clearPorteSession();         ME = null;         showMpCardView();         hide('pg-main');         flex('pg-login');       }     });
  </script>
  <!-- HITOTSUGI_UNIFIED_HEADER_END -->
</head>

<body>

  <div id="pg-loading">
    <div class="spin"></div>読み込み中...
  </div>

  <div id="pg-login">
    <div class="login-box">
      <div class="login-logo">
        <img src="kuma.png" onerror="this.style.display='none'">
        <h1>👤 ひとつぎ マイページ</h1>
      </div>

      <!-- スタッフカード選択画面 -->
      <div id="mp-card-view">
        <div style="font-size:12px;color:var(--sub);text-align:center;margin-bottom:14px;">スタッフを選択してください</div>
        <div id="mp-staff-card-grid"
          style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;max-height:48vh;overflow-y:auto;padding:4px">
          読み込み中...
        </div>
        <div style="margin-top:16px;text-align:center">
          <a href="javascript:void(0)" onclick="showMpTradLogin()"
            style="font-size:12px;color:var(--pri);text-decoration:underline;font-weight:600">🔑 従来のID・パスワードで入力</a>
        </div>
        <label
          style="display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;font-size:12px;font-weight:600;color:var(--sub);cursor:pointer;">
          <input type="checkbox" id="chk-keep-login"
            onchange="try{localStorage.setItem('porte_keep_login',this.checked?'1':'0')}catch(e){}"
            style="width:16px;height:16px;accent-color:var(--pri);cursor:pointer;">
          <span>📱 ログイン状態を保持する（個人スマホ用）</span>
        </label>
      </div>

      <!-- 4桁PINテンキー画面 -->
      <div id="mp-pin-view" style="display:none;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <button onclick="showMpCardView()"
            style="background:none;border:1px solid var(--bdr);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--pri)">←
            戻る</button>
          <div style="font-size:11px;color:var(--sub)">暗証番号認証</div>
        </div>
        <div style="text-align:center;margin-bottom:12px">
          <div id="mp-pin-avatar"
            style="width:48px;height:48px;border-radius:50%;background:var(--pri);color:#fff;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 4px">
            ?</div>
          <div id="mp-pin-name" style="font-size:16px;font-weight:800;color:var(--txt)">-</div>
          <div id="mp-pin-role" style="font-size:11px;color:var(--sub);margin-top:1px">-</div>
        </div>
        <div id="mp-pin-err"
          style="text-align:center;margin-bottom:10px;color:#c62828;font-size:12px;font-weight:700;display:none;"></div>
        <div style="font-size:11px;color:var(--sub);text-align:center;margin-bottom:6px">4桁の暗証番号（PIN）を入力</div>
        <div id="mp-pin-dots" style="display:flex;justify-content:center;gap:14px;margin-bottom:16px">
          <span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span><span
            class="pin-dot"></span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px">
          <button onclick="pressMpPinKey('1')"
            style="padding:12px 0;font-size:20px;font-weight:700;border:1.5px solid var(--bdr);border-radius:10px;background:#fff;color:var(--txt);cursor:pointer">1</button>
          <button onclick="pressMpPinKey('2')"
            style="padding:12px 0;font-size:20px;font-weight:700;border:1.5px solid var(--bdr);border-radius:10px;background:#fff;color:var(--txt);cursor:pointer">2</button>
          <button onclick="pressMpPinKey('3')"
            style="padding:12px 0;font-size:20px;font-weight:700;border:1.5px solid var(--bdr);border-radius:10px;background:#fff;color:var(--txt);cursor:pointer">3</button>
          <button onclick="pressMpPinKey('4')"
            style="padding:12px 0;font-size:20px;font-weight:700;border:1.5px solid var(--bdr);border-radius:10px;background:#fff;color:var(--txt);cursor:pointer">4</button>
          <button onclick="pressMpPinKey('5')"
            style="padding:12px 0;font-size:20px;font-weight:700;border:1.5px solid var(--bdr);border-radius:10px;background:#fff;color:var(--txt);cursor:pointer">5</button>
          <button onclick="pressMpPinKey('6')"
            style="padding:12px 0;font-size:20px;font-weight:700;border:1.5px solid var(--bdr);border-radius:10px;background:#fff;color:var(--txt);cursor:pointer">6</button>
          <button onclick="pressMpPinKey('7')"
            style="padding:12px 0;font-size:20px;font-weight:700;border:1.5px solid var(--bdr);border-radius:10px;background:#fff;color:var(--txt);cursor:pointer">7</button>
          <button onclick="pressMpPinKey('8')"
            style="padding:12px 0;font-size:20px;font-weight:700;border:1.5px solid var(--bdr);border-radius:10px;background:#fff;color:var(--txt);cursor:pointer">8</button>
          <button onclick="pressMpPinKey('9')"
            style="padding:12px 0;font-size:20px;font-weight:700;border:1.5px solid var(--bdr);border-radius:10px;background:#fff;color:var(--txt);cursor:pointer">9</button>
          <button onclick="clearMpPinKey()"
            style="padding:12px 0;font-size:14px;font-weight:700;border:1.5px solid var(--bdr);border-radius:10px;background:#f5f0ea;color:var(--pri);cursor:pointer">C</button>
          <button onclick="pressMpPinKey('0')"
            style="padding:12px 0;font-size:20px;font-weight:700;border:1.5px solid var(--bdr);border-radius:10px;background:#fff;color:var(--txt);cursor:pointer">0</button>
          <button onclick="backspaceMpPinKey()"
            style="padding:12px 0;font-size:14px;font-weight:700;border:1.5px solid var(--bdr);border-radius:10px;background:#f5f0ea;color:var(--pri);cursor:pointer">⌫</button>
        </div>
      </div>

      <!-- 従来ログイン画面 -->
      <div id="mp-trad-view" style="display:none;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <button onclick="showMpCardView()"
            style="background:none;border:1px solid var(--bdr);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--pri)">←
            スタッフ選択へ</button>
        </div>
        <div class="f">
          <label>ログインID</label>
          <input type="text" id="inp-id" autocomplete="username">
        </div>
        <div class="f">
          <label>パスワード</label>
          <input type="password" id="inp-pw" autocomplete="current-password">
        </div>
        <button id="btn-login">ログイン</button>
        <div id="login-err"></div>
      </div>
    </div>
  </div>

  <div id="pg-main">
    <header>
      <div>
        <div class="hd-name" id="hd-name"></div>
        <div class="hd-role" id="hd-role"></div>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <button id="btn-chg-pw" onclick="openChgPwModal()"
          style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer">🔑
          PIN変更</button>
        <button id="btn-logout">ログアウト</button>
      </div>
    </header>

    <!-- 未退勤・打刻漏れアラートエリア -->
    <div id="mp-alert-container"></div>

    <!-- タイムカード -->
    <div class="card" id="tc-card">
      <div class="ct">🕐 タイムカード — <span id="tc-date"></span></div>
      <div id="tc-body"></div>
    </div>

    <!-- タブ -->
    <div class="tabs">
      <button class="tb on" id="tb-shift" onclick="showTab('shift')">📆 シフト</button>
      <button class="tb" id="tb-att" onclick="showTab('att')">📊 打刻</button>
      <button class="tb" id="tb-paid" onclick="showTab('paid')">📅 有給</button>
      <button class="tb" id="tb-reqs" style="display:none;" onclick="showTab('reqs')">📋 申請履歴</button>
    </div>

    <div id="tab-shift">
      <div class="card">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
          <button onclick="shiftPrev()"
            style="border:1px solid var(--bdr);background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px">◀</button>
          <span id="shift-ym" style="flex:1;text-align:center;font-size:15px;font-weight:700"></span>
          <button onclick="shiftNext()"
            style="border:1px solid var(--bdr);background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px">▶</button>
          <button onclick="shiftNow()"
            style="border:1px solid var(--bdr);background:#fff;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:11px">今月</button>
        </div>
        <div id="shift-body" class="rows"></div>
      </div>
      <div class="card" id="my-shift-reqs-card">
        <div class="ct">📋 自分のシフト変更・勤怠修正 申請履歴</div>
        <div id="my-shift-reqs-list"></div>
      </div>
    </div>

    <div id="tab-att" style="display:none">
      <div class="card">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
          <button onclick="attPrev()"
            style="border:1px solid var(--bdr);background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px">◀</button>
          <span id="att-ym" style="flex:1;text-align:center;font-size:15px;font-weight:700"></span>
          <button onclick="attNext()"
            style="border:1px solid var(--bdr);background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px">▶</button>
          <button onclick="attNow()"
            style="border:1px solid var(--bdr);background:#fff;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:11px">今月</button>
        </div>
        <div class="sum3" id="att-sum"></div>
        <div id="att-body" class="rows"></div>
      </div>
    </div>

    <div id="tab-paid" style="display:none">
