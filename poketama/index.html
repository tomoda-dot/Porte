<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ポケモン風 2Dマップ・アドベンチャーRPG</title>
    <meta name="description" content="2Dマップを自由に歩き回り、草むらでモンスターを捕獲し、ジムリーダー戦やリーグ制覇を目指す本格HTML5レトロRPG！">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>

<div id="app-wrapper">
    <!-- Console Header Bar -->
    <header class="console-header">
        <div class="brand-title">
            <span style="font-size: 20px;">🎒</span>
            <span>ポケモンスターRPG</span>
        </div>
        <div class="header-badges">
            <div class="header-badge-item" style="color: #ffd15c;">🏆 バッジ: <span id="header-badges-val">0</span></div>
            <div class="header-badge-item" style="color: #ff5544;">⚾ ボール: <span id="header-balls-val">5</span></div>
            <div class="header-badge-item" style="color: #52e077;">🪙 <span id="header-money-val">1000</span>G</div>
        </div>
    </header>

    <!-- Game Screen Viewport -->
    <div class="game-viewport-container">
        <!-- 2D Map Canvas (320x320) -->
        <canvas id="map-canvas"></canvas>

        <!-- Battle Overlay Screen -->
        <div class="battle-overlay-view" id="battle-overlay">
            <div class="battle-stage-row">
                <!-- Player Unit Left -->
                <div class="player-platform-box">
                    <div class="unit-status-card">
                        <div style="display:flex; justify-content:space-between;">
                            <span id="battle-player-name" style="color:#ff65a3;">---</span>
                            <span id="battle-player-level" style="color:#ffd15c;">Lv.5</span>
                        </div>
                        <div class="unit-hp-bar-bg">
                            <div class="unit-hp-bar-fill" id="battle-player-hp-fill" style="width: 100%;"></div>
                        </div>
                        <div style="font-size: 9px; text-align: right; color: #aaa; margin-top: 2px;" id="battle-player-hp-text">--/--</div>
                    </div>
                    <div class="battle-unit-sprite" id="battle-player-sprite"></div>
                </div>

                <!-- Enemy Unit Right -->
                <div class="enemy-platform-box">
                    <div class="unit-status-card">
                        <div style="display:flex; justify-content:space-between;">
                            <span id="battle-enemy-name" style="color:#40c4ff;">---</span>
                            <span id="battle-enemy-level" style="color:#ffd15c;">Lv.3</span>
                        </div>
                        <div class="unit-hp-bar-bg">
                            <div class="unit-hp-bar-fill" id="battle-enemy-hp-fill" style="width: 100%;"></div>
                        </div>
                    </div>
                    <div class="battle-unit-sprite" id="battle-enemy-sprite"></div>
                </div>
            </div>

            <!-- Game Boy Command / Log Window -->
            <div class="gb-message-box">
                <div id="battle-log-text" style="height: 55px; overflow-y: auto;">
                    あせっ！ 野生のモンスターが飛び出してきた！
                </div>

                <div class="battle-commands-grid" id="battle-cmds-box">
                    <button class="cmd-btn" id="btn-cmd-fight">⚔️ たたかう</button>
                    <button class="cmd-btn" id="btn-cmd-bag">🎒 どうぐ</button>
                    <button class="cmd-btn" id="btn-cmd-party">🐾 ポケモン</button>
                    <button class="cmd-btn" id="btn-cmd-run">🏃 にげる</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Virtual D-Pad & Control Deck -->
    <div class="console-controls-deck">
        <!-- Cross D-Pad -->
        <div class="dpad-container">
            <button class="dpad-btn dpad-up" id="btn-dpad-up">▲</button>
            <button class="dpad-btn dpad-down" id="btn-dpad-down">▼</button>
            <button class="dpad-btn dpad-left" id="btn-dpad-left">◀</button>
            <button class="dpad-btn dpad-right" id="btn-dpad-right">▶</button>
            <div class="dpad-center"></div>
        </div>

        <!-- AB Action Buttons -->
        <div class="action-buttons-group">
            <button class="ab-btn ab-btn-menu" id="btn-action-menu">メニュー</button>
            <button class="ab-btn" id="btn-action-b">B</button>
            <button class="ab-btn" id="btn-action-a">A</button>
        </div>
    </div>
</div>

<!-- MODAL 1: STARTER POKEMON SELECT -->
<div class="modal-overlay" id="modal-starter">
    <div class="modal-card">
        <h2 style="color: var(--border-gold); text-align: center; margin-bottom: 6px;">✨ パートナー選択</h2>
        <p style="font-size: 12px; color: #b39ddb; text-align: center; margin-bottom: 14px;">最初の相棒となるポケモンを選んで冒険に出発しよう！</p>
        
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
            <div class="cmd-btn" style="padding: 12px; display:flex; flex-direction:column; align-items:center;" onclick="UIController.chooseStarter('fire_1')">
                <div style="width: 60px; height: 60px;">
                    <!-- SVG -->
                </div>
                <div style="font-size: 13px; color: #ff5544; font-weight: 900; margin-top: 4px;">ヒノコ</div>
                <small style="font-size: 9px; color: #aaa;">ほのおポケモン</small>
            </div>

            <div class="cmd-btn" style="padding: 12px; display:flex; flex-direction:column; align-items:center;" onclick="UIController.chooseStarter('water_1')">
                <div style="width: 60px; height: 60px;">
                    <!-- SVG -->
                </div>
                <div style="font-size: 13px; color: #33aaff; font-weight: 900; margin-top: 4px;">アクアプニ</div>
                <small style="font-size: 9px; color: #aaa;">みずポケモン</small>
            </div>

            <div class="cmd-btn" style="padding: 12px; display:flex; flex-direction:column; align-items:center;" onclick="UIController.chooseStarter('grass_1')">
                <div style="width: 60px; height: 60px;">
                    <!-- SVG -->
                </div>
                <div style="font-size: 13px; color: #44dd66; font-weight: 900; margin-top: 4px;">ポコリーフ</div>
                <small style="font-size: 9px; color: #aaa;">くさポケモン</small>
            </div>
        </div>
    </div>
</div>

<!-- MODAL 2: PARTY & BAG MENU -->
<div class="modal-overlay" id="modal-menu">
    <div class="modal-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <h3 style="color: var(--border-gold);">🎒 メインメニュー</h3>
            <button class="cmd-btn" style="padding: 4px 10px;" onclick="UIController.closeMenuModal()">✕ 閉じる</button>
        </div>

        <div style="margin-bottom: 14px;">
            <h4 style="color: #ff5544; font-size: 13px; margin-bottom: 6px;">🐾 手持ちポケモン (最大6体)</h4>
            <div id="party-list-box" style="display: flex; flex-direction: column; gap: 6px;">
                <!-- Rendered dynamically -->
            </div>
        </div>

        <div>
            <h4 style="color: #52e077; font-size: 13px; margin-bottom: 6px;">🎒 どうぐ</h4>
            <div id="items-list-box" style="font-size: 12px; color: #ddd; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px;">
                <!-- Rendered dynamically -->
            </div>
        </div>
    </div>
</div>

<script src="js/config/monsters.js"></script>
<script src="js/core/map.js"></script>
<script src="js/core/game.js"></script>
<script src="js/modules/battle.js"></script>
<script src="js/modules/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
