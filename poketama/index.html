<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER NEON TETRIS - スマホ特化型テトリス</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>

    <div id="app-container">

        <!-- Top Header Bar -->
        <header class="game-header">
            <div class="logo-container">
                <div class="logo-text">NEON TETRIS</div>
            </div>
            <div class="header-actions">
                <button id="btn-sound-toggle" class="icon-btn" aria-label="Sound Toggle">🔊</button>
                <button id="btn-pause" class="icon-btn" aria-label="Pause">⏸️</button>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-body">

            <!-- Left Panel: HOLD & HIGH SCORE -->
            <aside class="side-panel">
                <div class="card-box">
                    <span class="card-title">HOLD</span>
                    <canvas id="hold-canvas" class="mini-canvas" width="120" height="120"></canvas>
                </div>

                <div class="card-box" style="margin-top: auto;">
                    <span class="card-title">LEVEL</span>
                    <span id="level-val" class="stat-value">1</span>
                </div>

                <div class="card-box">
                    <span class="card-title">BEST</span>
                    <span id="hi-score-val" class="stat-value" style="font-size: 0.85rem; color: var(--accent-yellow);">0</span>
                </div>
            </aside>

            <!-- Center Board (Main Matrix Canvas) -->
            <div class="board-container" id="board-wrap">
                <canvas id="tetris-canvas" width="300" height="600"></canvas>
                <!-- Popup Effect Banner (Combos / Line Clears) -->
                <div id="effect-banner">TETRIS!</div>
            </div>

            <!-- Right Panel: NEXT QUEUE & LINES -->
            <aside class="side-panel">
                <div class="card-box">
                    <span class="card-title">NEXT</span>
                    <canvas id="next-canvas" class="next-queue-canvas" width="120" height="320"></canvas>
                </div>

                <div class="card-box" style="margin-top: auto;">
                    <span class="card-title">LINES</span>
                    <span id="lines-val" class="stat-value">0</span>
                </div>
            </aside>

        </main>

        <!-- Score Banner -->
        <div class="score-banner">
            <div class="score-group">
                <span class="stat-label">SCORE</span>
                <span id="score-val" class="score-main-value">0</span>
            </div>
            <div id="combo-indicator" class="stat-label" style="color: var(--accent-magenta); font-weight: bold;"></div>
        </div>

        <!-- On-Screen Virtual Gamepad Controller -->
        <nav class="controller-pad">
            <!-- Row 1: Hold, Rotate CCW, Rotate CW, Hard Drop -->
            <div class="control-row">
                <button id="btn-hold" class="pad-btn pad-btn-wide">📦 HOLD</button>
                <button id="btn-rot-ccw" class="pad-btn pad-btn-action">↩️</button>
                <button id="btn-rot-cw" class="pad-btn pad-btn-action">🔄</button>
                <button id="btn-hard-drop" class="pad-btn pad-btn-drop pad-btn-wide">⚡ DROP</button>
            </div>
            <!-- Row 2: Left, Down (Soft Drop), Right -->
            <div class="control-row">
                <button id="btn-left" class="pad-btn pad-btn-wide">⬅️</button>
                <button id="btn-down" class="pad-btn pad-btn-wide">⏬</button>
                <button id="btn-right" class="pad-btn pad-btn-wide">➡️</button>
            </div>
        </nav>

    </div>

    <!-- Pause Modal -->
    <div id="modal-pause" class="modal-overlay">
        <div class="modal-card">
            <h2 class="modal-title">PAUSED</h2>
            <div class="modal-body">
                <div class="stat-row setting-row">
                    <span>Sound Effects (効果音)</span>
                    <label class="switch">
                        <input type="checkbox" id="setting-sound" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="stat-row setting-row">
                    <span>Haptics (振動)</span>
                    <label class="switch">
                        <input type="checkbox" id="setting-haptics" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="stat-row setting-row">
                    <span>Ghost Piece (落下予測)</span>
                    <label class="switch">
                        <input type="checkbox" id="setting-ghost" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            <button id="btn-resume" class="primary-btn pulse">RESUME</button>
            <button id="btn-restart-pause" class="secondary-btn">RESTART GAME</button>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="modal-gameover" class="modal-overlay">
        <div class="modal-card">
            <h2 class="modal-title" style="background: linear-gradient(135deg, var(--accent-magenta), var(--accent-yellow)); -webkit-background-clip: text;">GAME OVER</h2>
            
            <div class="modal-body">
                <div class="stat-row">
                    <span class="stat-label">FINAL SCORE</span>
                    <span id="final-score-val" class="stat-value" style="font-size: 1.4rem;">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">LINES CLEARED</span>
                    <span id="final-lines-val" class="stat-value">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">LEVEL REACHED</span>
                    <span id="final-level-val" class="stat-value">1</span>
                </div>
                <div id="new-record-badge" class="stat-row" style="background: rgba(255, 230, 0, 0.15); border-color: var(--accent-yellow); display: none;">
                    <span style="color: var(--accent-yellow); font-weight: bold; font-size: 0.85rem;">🏆 NEW HIGH SCORE!</span>
                </div>
            </div>

            <button id="btn-play-again" class="primary-btn pulse">PLAY AGAIN</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/audio.js"></script>
    <script src="js/tetris.js"></script>
    <script src="js/controls.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
