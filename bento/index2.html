<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ひとつぎお弁当システム v2 (新管理＆在庫共有システム)</title>
  <link rel="stylesheet" href="style2.css?v=v2_20260928">
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Top App Header -->
  <header class="v2-header">
    <div class="v2-header-inner">
      <div class="v2-brand">
        <div class="v2-brand-icon">🍱</div>
        <div class="v2-brand-text">
          <h1>ひとつぎお弁当システム v2</h1>
          <p>リアルタイム全端末在庫同期 ＆ 注文履歴管理</p>
        </div>
      </div>
      <div class="v2-header-stats">
        <div class="v2-live-indicator">
          <span class="v2-live-dot"></span> リアルタイム同期中
        </div>
        <div class="v2-stat-pill">📅 <span id="v2HeaderDate">2026年9月28日</span></div>
        <div class="v2-stat-pill">👥 利用者: <strong id="v2UserCount">0名</strong></div>
        <div class="v2-stat-pill">🍱 注文: <strong id="v2OrderedCount">0食</strong></div>
        <div class="v2-stat-pill">📦 総在庫: <strong id="v2TotalStock">0食</strong></div>
      </div>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <nav class="v2-nav-bar">
    <div class="v2-nav-inner">
      <button class="v2-tab-btn active" data-tab="menu-tab">
        <span>✨ 本日のメニュー表 (5品)</span>
        <span class="v2-tab-badge">本日5品</span>
      </button>
      <button class="v2-tab-btn" data-tab="porte-tab">
        <span>📋 注文受付 ＆ 履歴ログ</span>
        <span class="v2-tab-badge">注文記録</span>
      </button>
      <button class="v2-tab-btn" data-tab="master-tab">
        <span>⚙️ 全在庫 ＆ 賞味期限管理</span>
        <span class="v2-tab-badge">在庫システム</span>
      </button>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main class="v2-main-content">

    <!-- Tab 1: 本日の5品 メニュー表 & タブレット選択 -->
    <section id="menu-tab" class="v2-tab-panel active">
      <div class="v2-card">
        <div class="v2-card-header">
          <h2 class="v2-card-title">🍱 本日の5品メニュー ＆ リアルタイム選択状況</h2>
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <a href="menu2.html" target="_blank" class="v2-btn v2-btn-pri" style="text-decoration:none;">
              📱 利用者用タブレットメニュー画面を開く
            </a>
          </div>
        </div>
        <div class="v2-card-body">
          <div class="v2-grid-5" id="v2TodaysMenuGrid">
            <!-- Dynamic 5 Bento Cards -->
          </div>
        </div>
      </div>
    </section>

    <!-- Tab 2: 注文受付 & 履歴ログ -->
    <section id="porte-tab" class="v2-tab-panel">
      <div class="v2-grid-2">
        <!-- 利用者選択テーブル -->
        <div class="v2-card">
          <div class="v2-card-header">
            <h2 class="v2-card-title">👥 本日の利用者お弁当選択一覧</h2>
          </div>
          <div class="v2-card-body">
            <div class="v2-table-wrap">
              <table class="v2-table">
                <thead>
                  <tr>
                    <th>氏名</th>
                    <th style="text-align:center;">お弁当</th>
                    <th>備考</th>
                    <th>選択中のお弁当</th>
                    <th style="text-align:center;">状態</th>
                  </tr>
                </thead>
                <tbody id="v2UserOrdersTbody">
                  <!-- User rows -->
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- 履歴ログ -->
        <div class="v2-card">
          <div class="v2-card-header">
            <h2 class="v2-card-title">📜 リアルタイム注文・受付履歴</h2>
          </div>
          <div class="v2-card-body">
            <div class="v2-table-wrap">
              <table class="v2-table">
                <thead>
                  <tr>
                    <th>日時</th>
                    <th>氏名</th>
                    <th>注文お弁当</th>
                    <th>カテゴリ</th>
                  </tr>
                </thead>
                <tbody id="v2HistoryTbody">
                  <!-- History rows -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Tab 3: 全在庫 ＆ 賞味期限管理 -->
    <section id="master-tab" class="v2-tab-panel">
      <div class="v2-card">
        <div class="v2-card-header">
          <h2 class="v2-card-title">⚙️ 商品マスター ＆ リアルタイム在庫・賞味期限管理</h2>
        </div>
        <div class="v2-card-body">
          <div id="v2MasterInventoryGrid">
            <!-- Master inventory table -->
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Toast Container -->
  <div id="v2ToastContainer" class="v2-toast-container"></div>

  <!-- Scripts -->
  <script src="supabase-config.js"></script>
  <script src="app2.js?v=v2_20260928"></script>
</body>
</html>
