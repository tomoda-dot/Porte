<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>本日の昼食お弁当メニュー (タブレット専用 kiosk v2)</title>
  <link rel="stylesheet" href="style2.css?v=v2_20260928">
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Canvas Confetti for Celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body style="background: linear-gradient(135deg, #faf6f0 0%, #f4ede4 100%); min-height: 100vh;">

  <!-- Kiosk Header -->
  <header class="v2-header" style="background: linear-gradient(135deg, #d84315 0%, #bf360c 100%); padding: 18px 28px;">
    <div class="v2-header-inner">
      <div class="v2-brand">
        <div class="v2-brand-icon" style="font-size: 2.5rem; width: 60px; height: 60px;">🍱</div>
        <div class="v2-brand-text">
          <h1 style="font-size: 1.7rem;">本日の昼食お弁当メニュー</h1>
          <p style="font-size: 0.9rem;">食べたいお弁当の「これにする！🎯」を押してください</p>
        </div>
      </div>
      <div class="v2-header-stats">
        <div class="v2-live-indicator" style="background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.4); color:#ffffff;">
          <span class="v2-live-dot" style="background:#a5d6a7;"></span> リアルタイム同期中
        </div>
        <div class="v2-stat-pill" id="kioskDatePill" style="font-size: 1rem; padding: 8px 18px;">2026年9月28日</div>
        <a href="index2.html" class="v2-btn v2-btn-sec v2-btn-sm" style="text-decoration:none; background: rgba(255,255,255,0.2); color:#fff; border-color:rgba(255,255,255,0.4);">⚙️ 管理画面</a>
      </div>
    </div>
  </header>

  <!-- Kiosk Menu Grid -->
  <main class="v2-main-content" style="padding-top: 32px;">
    <div class="v2-grid-5" id="kioskMenuGrid">
      <!-- 5 Bento Cards rendered dynamically -->
    </div>
  </main>

  <!-- User Picker Modal -->
  <div class="v2-modal-overlay" id="kioskUserModal">
    <div class="v2-modal-box" style="max-width: 680px;">
      <div class="v2-modal-hd">
        <h3 id="modalBentoTitle" style="font-size: 1.4rem;">🍱 『お弁当名』</h3>
        <button class="v2-close-btn" onclick="closeKioskUserModal()">&times;</button>
      </div>
      <div class="v2-modal-bd">
        <p style="font-weight: 800; font-size: 1.1rem; color: var(--txt-primary); margin-bottom: 16px; text-align: center;">
          どなたのご注文にしますか？お名前をタップしてください
        </p>

        <div id="kioskUserGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; max-height: 50vh; overflow-y: auto; padding: 4px;">
          <!-- User buttons -->
        </div>
      </div>
      <div class="v2-modal-ft">
        <button class="v2-btn v2-btn-sec" onclick="closeKioskUserModal()">戻る</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="v2ToastContainer" class="v2-toast-container"></div>

  <!-- Scripts -->
  <script src="supabase-config.js"></script>
  <script src="app2.js?v=v2_20260928"></script>
  <script>
    let selectedBentoIdForKiosk = null;

    document.addEventListener('DOMContentLoaded', () => {
      renderKioskMenu();
      initSupabaseRealtimeV2();
      syncFromSupabaseV2();
    });

    function renderKioskMenu() {
      const grid = document.getElementById('kioskMenuGrid');
      if (!grid) return;
      grid.innerHTML = '';

      const items = BentoState.todaysMenuIds.map(id => BentoState.master.find(b => b.id === id)).filter(Boolean);
      if (items.length === 0) {
        grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; padding:40px; font-weight:800; font-size:1.2rem; color:var(--txt-secondary);">メニューを読み込んでいます...</p>';
        return;
      }

      items.forEach((item, idx) => {
        const isSoldOut = item.stock <= 0;

        // Selected users for this bento
        const selectedUsers = [];
        BentoState.porteUsers.forEach(u => {
          normalizeUserDataV2(u);
          if ((u.selectedBentoIds || []).includes(item.id)) {
            selectedUsers.push(u.name);
          }
        });

        const card = document.createElement('div');
        card.className = `v2-bento-card ${isSoldOut ? 'sold-out' : ''}`;
        card.innerHTML = `
          <span class="v2-bento-num-badge">第 ${idx + 1} 案</span>
          <span class="v2-bento-cat-badge">${item.category}</span>
          <div class="v2-bento-icon-title">
            <span class="v2-bento-icon">${item.icon}</span>
            <h2 class="v2-bento-name" style="font-size:1.3rem;">${item.name}</h2>
          </div>
          <p class="v2-bento-desc" style="font-size:0.9rem;">${item.desc || ''}</p>

          <div class="v2-bento-stock-bar" style="margin-bottom:18px;">
            <span>リアルタイム在庫:</span>
            <span class="v2-bento-stock-val ${isSoldOut ? 'low' : ''}" style="font-size:1.2rem;">${isSoldOut ? '完売御礼 (0食)' : item.stock + '食'}</span>
          </div>

          <div class="v2-bento-users-pills">
            ${selectedUsers.map(name => `<span class="v2-user-pill" style="font-size:0.85rem; padding:4px 12px;">👤 ${name} 様</span>`).join('') || '<span style="font-size:0.85rem; color:var(--txt-muted);">まだ選ばれていません</span>'}
          </div>

          <button class="v2-btn v2-btn-pri" style="font-size:1.1rem; padding:14px;" ${isSoldOut ? 'disabled' : ''} onclick="openKioskUserModal('${item.id}')">
            ${isSoldOut ? '売り切れ' : 'これにする！ 🎯'}
          </button>
        `;
        grid.appendChild(card);
      });
    }

    function openKioskUserModal(bentoId) {
      const bento = BentoState.master.find(b => b.id === bentoId);
      if (!bento || bento.stock <= 0) return;

      selectedBentoIdForKiosk = bentoId;
      document.getElementById('modalBentoTitle').textContent = `🍱 『${bento.name}』`;
      
      renderKioskUserGrid();
      document.getElementById('kioskUserModal').classList.add('active');
    }

    function closeKioskUserModal() {
      document.getElementById('kioskUserModal').classList.remove('active');
      selectedBentoIdForKiosk = null;
    }

    function renderKioskUserGrid() {
      const grid = document.getElementById('kioskUserGrid');
      if (!grid) return;
      grid.innerHTML = '';

      if (BentoState.porteUsers.length === 0) {
        grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; padding:20px; color:var(--txt-muted);">利用者が登録されていません</p>';
        return;
      }

      BentoState.porteUsers.forEach((u, uIdx) => {
        normalizeUserDataV2(u);
        const hasChosenThis = (u.selectedBentoIds || []).includes(selectedBentoIdForKiosk);

        const btn = document.createElement('button');
        btn.className = `v2-btn ${hasChosenThis ? 'v2-btn-grn' : 'v2-btn-sec'}`;
        btn.style.cssText = 'width: 100%; justify-content: space-between; padding: 14px 18px; font-size: 1.05rem;';
        btn.innerHTML = `
          <span>👤 ${u.name} 様</span>
          ${hasChosenThis ? '<span>✅ 選択中</span>' : ''}
        `;
        btn.onclick = () => selectKioskOrder(uIdx);
        grid.appendChild(btn);
      });
    }

    async function selectKioskOrder(uIdx) {
      if (!selectedBentoIdForKiosk) return;
      const user = BentoState.porteUsers[uIdx];
      if (!user) return;

      const bento = BentoState.master.find(b => b.id === selectedBentoIdForKiosk);
      if (!bento || bento.stock <= 0) return;

      const hasChosenThis = (user.selectedBentoIds || []).includes(selectedBentoIdForKiosk);
      if (hasChosenThis) {
        // Toggle unselect
        const slotIdx = user.selectedBentoIds.indexOf(selectedBentoIdForKiosk);
        if (slotIdx >= 0) {
          await assignUserBentoSlotV2(uIdx, slotIdx, '');
          closeKioskUserModal();
          renderKioskMenu();
          showToastV2(`${user.name} 様 『${bento.name}』の選択をキャンセルしました`, 'info');
          return;
        }
      }

      // Assign bento slot 0
      await assignUserBentoSlotV2(uIdx, 0, selectedBentoIdForKiosk);
      closeKioskUserModal();
      renderKioskMenu();

      // Confetti Celebration
      if (typeof confetti === 'function') {
        confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
      }

      showToastV2(`🎉 ${user.name} 様 『${bento.name}』を決定しました！`, 'success');
    }

    // Override renderAllV2 to also render kiosk grid
    const origRenderAll = window.renderAllV2;
    window.renderAllV2 = function() {
      if (typeof origRenderAll === 'function') origRenderAll();
      renderKioskMenu();
    };
  </script>
</body>
</html>
