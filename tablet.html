<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>日報入力 | ひとつぎ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js?v=20261026b"></script>
<script src="supabase-adapter.js?v=20261026b"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html, body { height: 100%; overflow: hidden; }
html, body, input, select, textarea, button { touch-action: manipulation; }
input, select, textarea { font-size: 16px !important; }
:root{--pri:#3d5a3e;--bg:#f7f4f0;--card:#fff;--bdr:#e0d6cf;--sub:#8a7a6a;--grn:#2e7d32;--acc:#c07830;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:#333;font-size:15px;}

/* ログイン */
#pg-login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
.login-box{background:#fff;border-radius:16px;padding:36px 28px;width:100%;max-width:400px;box-shadow:0 4px 20px rgba(0,0,0,.1);}
.login-logo{text-align:center;margin-bottom:24px;}
.login-logo .ico{font-size:44px;display:block;}
.login-logo h1{font-size:20px;font-weight:700;color:var(--pri);margin-top:8px;}
.f label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:5px;margin-top:14px;}
.f input,.f select{width:100%;padding:12px 14px;border:1.5px solid var(--bdr);border-radius:8px;font-size:15px;background:#fff;}
.f input:focus,.f select:focus{outline:none;border-color:var(--pri);}
#btn-login{width:100%;padding:14px;background:var(--pri);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;margin-top:18px;}
#login-err{color:#c62828;font-size:13px;text-align:center;margin-top:8px;min-height:16px;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid #ccc;background:#fff;transition:all .15s ease;}
.tb-staff-card{background:#f8f6f2;border:1.5px solid var(--bdr);border-radius:12px;padding:14px 8px;text-align:center;cursor:pointer;transition:.2s;}
.tb-staff-card:hover{border-color:var(--pri);transform:translateY(-2px);}

/* メイン */
#pg-main{display:none;height:100vh;height:100dvh;overflow:hidden;flex-direction:column;}
#pg-loading{display:none;text-align:center;padding:80px 20px;color:var(--sub);}
.spin{width:32px;height:32px;border:3px solid var(--bdr);border-top-color:var(--pri);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px;}
@keyframes sp{to{transform:rotate(360deg);}}

/* ヘッダー */
header{background:var(--pri);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:10;}
.hd-title{font-size:18px;font-weight:700;}
.hd-staff{font-size:13px;font-weight:600;color:rgba(255,255,255,.95);background:rgba(255,255,255,.15);padding:5px 12px;border-radius:20px;display:inline-flex;align-items:center;gap:4px;}
#btn-logout{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 14px;border-radius:16px;font-size:13px;cursor:pointer;}

/* メインコンテンツ */
.main-inner{max-width:900px;margin:0 auto;padding:20px 16px;}

/* セレクター行削除（サイドバーに統合）*/
.selector-row{display:none;}

/* カード */
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.card-title{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:16px;display:flex;align-items:center;gap:6px;}

/* グリッド */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}

/* フォーム */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--bdr);border-radius:8px;font-size:14px;background:#fff;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--pri);}
.field textarea{resize:vertical;min-height:90px;}
.field .hint{font-size:11px;color:var(--sub);margin-top:4px;}

/* 実働時間 */
.work-time-badge{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:8px;padding:6px 14px;font-size:13px;font-weight:700;color:var(--pri);}

/* 保存ボタン（画面右下に常時固定、スマホ時は全幅固定） */
.save-bar{
  position:fixed;
  bottom:0;
  right:0;
  left:240px;
  background:rgba(247,244,240,.98);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  padding:12px 20px calc(12px + env(safe-area-inset-bottom, 0px));
  display:flex;
  gap:12px;
  justify-content:flex-end;
  border-top:1px solid var(--bdr);
  box-shadow:0 -4px 16px rgba(0,0,0,.08);
  z-index:90;
}
#btn-save{padding:12px 36px;background:var(--pri);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 2px 6px rgba(61,90,62,.3);touch-action:manipulation;}
#btn-save:disabled{opacity:.6;cursor:not-allowed;}
#btn-cancel{padding:12px 20px;background:#fff;color:var(--sub);border:1.5px solid var(--bdr);border-radius:10px;font-size:15px;cursor:pointer;touch-action:manipulation;}

.author-badge-wrap{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:6px;min-height:22px;}
.author-badge{display:inline-flex;align-items:center;padding:2px 10px;border:1.5px solid #2e7d32;border-radius:12px;background:#f1f8e9;color:#1b5e20;font-size:11px;font-weight:700;letter-spacing:0.5px;}
.author-arrow{color:#8a7a6a;font-size:12px;font-weight:700;}

/* 状態バッジ */
.status-opts{display:flex;gap:8px;flex-wrap:wrap;}
.status-opt{flex:1;min-width:80px;padding:10px 4px;border:2px solid var(--bdr);border-radius:8px;background:#fff;color:var(--sub);font-size:13px;font-weight:700;cursor:pointer;text-align:center;}
.status-opt.on{border-color:var(--pri);background:var(--pri);color:#fff;}
.status-opt.on.absent{border-color:#c62828;background:#c62828;}
.status-opt.on.other{border-color:var(--acc);background:var(--acc);}

/* 完了メッセージ */
#pg-done{display:none;text-align:center;padding:60px 20px;}
.done-ico{font-size:64px;display:block;margin-bottom:16px;}
#btn-next{padding:14px 40px;background:var(--pri);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:20px;}

/* レイアウト */
#layout{display:flex;flex:1;height:calc(100vh - 50px);height:calc(100dvh - 50px);overflow:hidden;min-height:0;}
#sidebar{width:240px;min-width:200px;background:#fff;border-right:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;}
#sidebar-header{padding:12px 14px;border-bottom:1px solid var(--bdr);background:var(--bg);}
#sidebar-header .date-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
#sidebar-header input[type=date]{flex:1;padding:6px 8px;border:1.5px solid var(--bdr);border-radius:6px;font-size:13px;}
#sidebar-header .search-box{width:100%;padding:8px 10px;border:1.5px solid var(--bdr);border-radius:6px;font-size:13px;}
#user-list{flex:1;overflow-y:auto;padding:6px 0;}
.user-item{padding:12px 14px;cursor:pointer;border-bottom:1px solid #f5f0ea;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.user-item:hover{background:#f5f0ea;}
.user-item.active{background:var(--pri);color:#fff;}
.user-item .u-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-item .u-kana{font-size:11px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-item .u-badge{font-size:11px;margin-top:0;white-space:nowrap;flex-shrink:0;}
.u-badge.saved{color:var(--grn);font-weight:700;white-space:nowrap;}
.user-item.active .u-badge.saved{color:#a5d6a7;}
#content-area{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px 20px 90px;height:100%;min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;}

.mobile-back-btn{display:none;}

/* スマホ表示最適化 (600px以下) */
@media(max-width:600px){
  html, body { height: auto; overflow: auto; }
  #pg-main { height: auto; overflow: visible; }
  #layout{flex-direction:column;height:auto;min-height:calc(100vh - 54px);}
  
  body.mobile-view-list #sidebar{width:100%!important;min-width:100%;display:flex!important;height:calc(100vh - 54px);border-right:none;}
  body.mobile-view-list #content-area{display:none!important;}

  body.mobile-view-form #sidebar{display:none!important;}
  body.mobile-view-form #content-area{width:100%!important;display:block!important;padding:12px 10px 80px;}

  .mobile-back-btn{
    display:inline-flex;align-items:center;gap:6px;
    background:#fff;color:var(--pri);border:1.5px solid var(--pri);
    padding:8px 14px;border-radius:8px;font-size:13px;font-weight:700;
    margin-bottom:12px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.06);
  }

  header{padding:10px 14px;}
  .hd-title{font-size:16px;}
  .hd-staff{font-size:11px;padding:4px 8px;}
  #btn-logout{font-size:11px;padding:4px 10px;}

  .card{padding:16px 12px;margin-bottom:12px;border-radius:10px;}
  .grid2,.grid3{grid-template-columns:1fr;gap:10px;}

  .status-opts{display:grid;grid-template-columns:repeat(3, 1fr);gap:6px;}
  .status-opt{min-width:0;padding:10px 2px;font-size:13px;}

  .save-bar{left:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom, 0px));gap:8px;}
  #btn-save{flex:1;padding:12px 10px;font-size:15px;}
  #btn-cancel{padding:12px 12px;font-size:13px;}
}

/* 珈琲HACCP ナビゲーション & カードウィザード スタイル */
.tb-nav-tabs{display:inline-flex;background:rgba(255,255,255,0.18);border-radius:24px;padding:3px;gap:4px;}
.tb-nav-btn{background:none;border:none;color:#fff;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;transition:.2s;}
.tb-nav-btn.active{background:#fff;color:var(--pri);box-shadow:0 2px 6px rgba(0,0,0,0.15);}

#layout-haccp{display:none;height:calc(100vh - 58px);height:calc(100dvh - 58px);overflow-y:auto;background:var(--bg);padding:16px;}
.haccp-sub-nav{display:flex;justify-content:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.haccp-sub-btn{padding:8px 18px;border-radius:24px;border:1.5px solid var(--bdr);background:#fff;color:var(--sub);font-size:13px;font-weight:700;cursor:pointer;transition:.2s;}
.haccp-sub-btn.active{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 2px 8px rgba(61,90,62,0.25);}

/* カードめくりウィザード */
.haccp-card-wrap{max-width:620px;margin:10px auto 30px;perspective:1000px;}
.haccp-card{
  background:#fff;
  border-radius:24px;
  padding:32px 24px;
  box-shadow:0 8px 32px rgba(61,90,62,0.12);
  border:2px solid #ede5dc;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  min-height:430px;
  position:relative;
  transition:all .3s cubic-bezier(0.25, 0.8, 0.25, 1);
}
.haccp-progress-bar{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:18px;}
.haccp-dot{width:12px;height:12px;border-radius:50%;background:#e0d6cf;transition:.2s;}
.haccp-dot.active{background:var(--pri);transform:scale(1.3);}
.haccp-dot.passed{background:#81c784;}
.haccp-step-badge{font-size:12px;font-weight:700;color:var(--sub);background:#f5f0ea;padding:3px 10px;border-radius:12px;margin-bottom:12px;}

.haccp-icon{font-size:68px;line-height:1;margin:10px 0;animation:popBounce .6s ease;}
@keyframes popBounce{0%{transform:scale(0.5);opacity:0;}70%{transform:scale(1.15);}100%{transform:scale(1);opacity:1;}}

.haccp-q-title{font-size:22px;font-weight:800;color:#2e442f;margin-bottom:8px;line-height:1.35;}
.haccp-q-desc{font-size:15px;color:#5c5046;line-height:1.6;margin-bottom:24px;max-width:480px;}

.haccp-btn-row{display:flex;gap:14px;width:100%;max-width:500px;margin-top:auto;}
.haccp-btn-yes{
  flex:1.4;
  padding:18px 20px;
  background:#2e7d32;
  color:#fff;
  border:none;
  border-radius:18px;
  font-size:19px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(46,125,50,0.35);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  touch-action:manipulation;
  transition:all .15s ease;
}
.haccp-btn-yes:active{transform:scale(0.97);box-shadow:0 2px 6px rgba(46,125,50,0.2);}
.haccp-btn-no{
  flex:1;
  padding:18px 16px;
  background:#f7f3ee;
  color:#795548;
  border:2px solid #d7ccc8;
  border-radius:18px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  touch-action:manipulation;
  transition:all .15s ease;
}
.haccp-btn-no:active{transform:scale(0.97);background:#ede0d4;}

/* 利用者選択グリッド */
.haccp-user-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:12px;width:100%;max-height:280px;overflow-y:auto;padding:8px 4px;margin-bottom:12px;}
.haccp-user-btn{
  background:#f9f8f5;
  border:2px solid var(--bdr);
  border-radius:14px;
  padding:14px 8px;
  text-align:center;
  font-size:15px;
  font-weight:700;
  color:#333;
  cursor:pointer;
  transition:.2s;
}
.haccp-user-btn:hover,.haccp-user-btn:active{border-color:var(--pri);background:#e8f5e9;color:var(--pri);transform:translateY(-2px);}
.haccp-user-btn.selected{border-color:var(--pri);background:var(--pri);color:#fff;}
</style>
</head>
<body>

<div id="pg-loading"><div class="spin"></div>読み込み中...</div>

<!-- ログイン -->
<div id="pg-login">
  <a href="https://tomoda-dot.github.io/DagashiShop/" style="position:fixed;bottom:20px;right:20px;z-index:9999;background:#f49576;color:white;border:none;padding:14px 24px;border-radius:50px;font-weight:bold;font-size:14px;text-decoration:none;box-shadow:0 5px 15px rgba(0,0,0,0.3);opacity:0.85;transition:0.3s;display:inline-flex;align-items:center;justify-content:center;">TOPへ戻る</a>
  <div class="login-box" style="width:460px;max-width:92vw;padding:28px 20px;">
    <div class="login-logo" style="margin-bottom:16px;">
      <span class="ico">📋</span>
      <h1>日報入力</h1>
      <p style="font-size:12px;color:var(--sub);margin-top:4px">ひとつぎ豊中小曽根</p>
    </div>

    <!-- スタッフカード選択画面 -->
    <div id="tb-card-view">
      <div style="font-size:12px;color:var(--sub);text-align:center;margin-bottom:14px;">自分の名前を選択してください</div>
      <div id="tb-staff-card-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;max-height:48vh;overflow-y:auto;padding:4px">
        読み込み中...
      </div>
      <div style="margin-top:16px;text-align:center">
        <a href="javascript:void(0)" onclick="showTbTradLogin()" style="font-size:12px;color:var(--pri);text-decoration:underline;font-weight:600">🔑 従来のID・パスワードで入力</a>
      </div>
    </div>

    <!-- 4桁PINテンキー画面 -->
    <div id="tb-pin-view" style="display:none;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <button onclick="showTbCardView()" style="background:none;border:1px solid var(--bdr);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--pri)">← 戻る</button>
        <div style="font-size:11px;color:var(--sub)">暗証番号認証</div>
      </div>
      <div style="text-align:center;margin-bottom:12px">
        <div id="tb-pin-avatar" style="width:48px;height:48px;border-radius:50%;background:var(--pri);color:#fff;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 4px">?</div>
        <div id="tb-pin-name" style="font-size:16px;font-weight:800;color:var(--txt)">-</div>
        <div id="tb-pin-role" style="font-size:11px;color:var(--sub);margin-top:1px">-</div>
      </div>
      <div id="tb-pin-err" style="text-align:center;margin-bottom:10px;color:#c62828;font-size:12px;font-weight:700;display:none;"></div>
      <div style="font-size:11px;color:var(--sub);text-align:center;margin-bottom:6px">4桁の暗証番号（PIN）を入力</div>
      <div id="tb-pin-dots" style="display:flex;justify-content:center;gap:14px;margin-bottom:16px">
        <span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px">
        <button onclick="pressTbPinKey('1')" style="padding:12px 0;font-size:20px;font-weight:700;border:1.5px solid var(--bdr);border-radius:10px;background:#fff;color:var(--txt);cursor:pointer">1</button>
        <button onclick="pressTbPinKey('2')" style="padding:12px 0;font-size:20px;font-weight:700;border:1.5px solid var(--bdr);border-radius:10px;background:#fff;color:var(--txt);cursor:pointer">2</button>
        <button onclick="pressTbPinKey('3')" style="padding:12px 0;font-size:20px;font-weight:700;border:1.5px solid var(--bdr);border-radius:10px;background:#fff;color:var(--txt);cursor:pointer">3</button>
        <button onclick="pressTbPinKey('4')" style="padding:12px 0;font-size:20px;font-weight:700;border:1.5px solid var(--bdr);border-radius:10px;background:#fff;color:var(--txt);cursor:pointer">4</button>
        <button onclick="pressTbPinKey('5')" style="padding:12px 0;font-size:20px;font-weight:700;border:1.5px solid var(--bdr);border-radius:10px;background:#fff;color:var(--txt);cursor:pointer">5</button>
        <button onclick="pressTbPinKey('6')" style="padding:12px 0;font-size:20px;font-weight:700;border:1.5px solid var(--bdr);border-radius:10px;background:#fff;color:var(--txt);cursor:pointer">6</button>
        <button onclick="pressTbPinKey('7')" style="padding:12px 0;font-size:20px;font-weight:700;border:1.5px solid var(--bdr);border-radius:10px;background:#fff;color:var(--txt);cursor:pointer">7</button>
        <button onclick="pressTbPinKey('8')" style="padding:12px 0;font-size:20px;font-weight:700;border:1.5px solid var(--bdr);border-radius:10px;background:#fff;color:var(--txt);cursor:pointer">8</button>
        <button onclick="pressTbPinKey('9')" style="padding:12px 0;font-size:20px;font-weight:700;border:1.5px solid var(--bdr);border-radius:10px;background:#fff;color:var(--txt);cursor:pointer">9</button>
        <button onclick="clearTbPinKey()" style="padding:12px 0;font-size:14px;font-weight:700;border:1.5px solid var(--bdr);border-radius:10px;background:#f5f0ea;color:var(--pri);cursor:pointer">C</button>
        <button onclick="pressTbPinKey('0')" style="padding:12px 0;font-size:20px;font-weight:700;border:1.5px solid var(--bdr);border-radius:10px;background:#fff;color:var(--txt);cursor:pointer">0</button>
        <button onclick="backspaceTbPinKey()" style="padding:12px 0;font-size:14px;font-weight:700;border:1.5px solid var(--bdr);border-radius:10px;background:#f5f0ea;color:var(--pri);cursor:pointer">⌫</button>
      </div>
    </div>

    <!-- 従来ログイン画面 -->
    <div id="tb-trad-view" style="display:none;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <button onclick="showTbCardView()" style="background:none;border:1px solid var(--bdr);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--pri)">← スタッフ選択へ</button>
      </div>
      <div class="f"><label>スタッフID</label><input type="text" id="inp-id" autocomplete="username" placeholder="ログインIDを入力"></div>
      <div class="f"><label>パスワード</label><input type="password" id="inp-pw" autocomplete="current-password" placeholder="パスワードを入力"></div>
      <button id="btn-login">ログイン</button>
      <div id="login-err"></div>
    </div>
  </div>
</div>

<!-- メイン -->
<div id="pg-main">
  <header>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">

      <div class="tb-nav-tabs">

<script>
'use strict';
var ME = null;
var USERS = [], WORK_TYPES = [], TEMPLATES = [], SETTINGS = {};
var CURRENT_STATUS = '出席';
var SAVED_DATES = {};
var ATTENDANCE_CACHE = {};
var TEMP_CACHE = {};

// ─── ユーティリティ ─────────────────────
function pad(n){ return String(n).padStart(2,'0'); }
function today(){
  var d=new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function fmtDateJP(s){
  if(!s)return '';
  var p=s.split('-');
  var dow=['日','月','火','水','木','金','土'][new Date(s).getDay()];
  return p[0]+'年'+parseInt(p[1])+'月'+parseInt(p[2])+'日（'+dow+'）';
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function el(id){ return document.getElementById(id); }
function show(id){ var e=el(id); if(e)e.style.display='block'; }
function hide(id){ var e=el(id); if(e)e.style.display='none'; }
function cleanNotesText(str){
  if(!str) return '';
  return String(str).replace(/\s*<!--(ADJ|AUTH):.*?-->\s*/g, '').trim();
}

// スタッフ名から短縮名（苗字）を取得
function getShortStaffName(name){
  if(!name) return '';
  name = String(name).trim();
  if(name.indexOf(' ') >= 0 || name.indexOf('　') >= 0){
    return name.split(/[\s　]+/)[0];
  }
  if(name.length === 4){
    return name.slice(0, 2);
  }
  return name.length > 3 ? name.slice(0, 2) : name;
}

// テキストから <!--AUTH:...--> メタデータを抽出
function extractAuthorMeta(text){
  if(!text || typeof text !== 'string') return { text: '', created: '', updated: '' };
  var m = text.match(/<!--AUTH:(.*?)-->/);
  var clean = cleanNotesText(text);
  if(!m) return { text: clean, created: '', updated: '' };
  try {
    var obj = JSON.parse(m[1]);
    return { text: clean, created: obj.created || '', updated: obj.updated || '' };
  } catch(e) {
    return { text: clean, created: '', updated: '' };
  }
}

// 変更を検知してメタデータ付きテキストを生成
function buildAuthorText(newRawText, originalMeta, currentStaffName){
  var cleanNew = String(newRawText || '').replace(/\s*<!--(ADJ|AUTH):.*?-->\s*/g, '').trim();
  if(!cleanNew) return '';

  var shortName = getShortStaffName(currentStaffName);
  var created = originalMeta ? originalMeta.created : '';
  var updated = originalMeta ? originalMeta.updated : '';
  var cleanOrig = originalMeta ? originalMeta.text : '';

  // 文章が1文字も変わっていない場合は既存のメタデータをそのまま維持
  if(cleanNew === cleanOrig && created){
    var metaObj = { created: created };
    if(updated && updated !== created) metaObj.updated = updated;
    return cleanNew + ' <!--AUTH:' + JSON.stringify(metaObj) + '-->';
  }

  // 文章が変更された場合
  if(!shortName){
    return cleanNew + (created ? ' <!--AUTH:' + JSON.stringify({created: created, updated: updated}) + '-->' : '');
  }

  if(!created){
    created = shortName;
    updated = '';
  } else if(shortName !== created){
    updated = shortName;
  } else {
    updated = '';
  }

  var metaObj = { created: created };
  if(updated && updated !== created) metaObj.updated = updated;
  return cleanNew + ' <!--AUTH:' + JSON.stringify(metaObj) + '-->';
}

// バッジHTMLの描画（[ 友田 ] または [ 友田 ] → [ 太中 ]）
function renderAuthorBadgeHTML(authorMeta){
  if(!authorMeta || !authorMeta.created) return '';
  var h = '<div class="author-badge-wrap">';
  h += '<span class="author-badge">' + esc(authorMeta.created) + '</span>';
  if(authorMeta.updated && authorMeta.updated !== authorMeta.created){
    h += '<span class="author-arrow">→</span>';
    h += '<span class="author-badge">' + esc(authorMeta.updated) + '</span>';
  }
  h += '</div>';
  return h;
}

function calcWorkTime(){
  var sInput = el('f-start'), eInput = el('f-end'), bInput = el('f-break');
  if(!sInput || !eInput) return 0;
  var s=sInput.value, e=eInput.value, b=parseInt(bInput?bInput.value:'60')||0;
  if(!s||!e)return 0;
  var sp=s.split(':'), ep=e.split(':');
  var mins=parseInt(ep[0])*60+parseInt(ep[1])-parseInt(sp[0])*60-parseInt(sp[1])-b;
  return Math.max(0,Math.round(mins/60*100)/100);
}

function updateWorkTimeBadge(){
  var h=calcWorkTime();
  var b=el('work-time-badge');
  if(b) b.textContent='実働: '+h+'時間';
}

// ─── ログイン ─────────────────────────
var TB_STAFF_LIST = [];
var _selectedTbStaff = null;
var _tbPinInput = '';

async function loadTbStaffCards(){
  try {
    var staffList = await gas('getStaff');
    TB_STAFF_LIST = staffList || [];
    renderTbStaffCards();
  } catch(e) {
    var grid = el('tb-staff-card-grid');
    if (grid) grid.innerHTML = '<div style="color:#c62828;text-align:center;padding:10px">取得エラー: ' + esc(e.message||e) + '</div>';
  }
}

function isStaffActive(s, targetDate){
  if (!s) return false;
  var lid = String(s.loginId || '').toLowerCase();
  var name = String(s.name || '').toLowerCase();
  if (lid === 'administrator' || name === 'administrator') return false;

  var st = String(s.status || s.userStatus || '').trim();
  if (['無効', '非表示', '削除'].indexOf(st) >= 0) return false;
  if (s.isArchived === true || s.active === false) return false;

  var td = typeof today === 'function' ? today() : new Date().toISOString().slice(0, 10);
  var d = targetDate || td;
  d = String(d).slice(0, 10);

  // 年月指定の場合（YYYY-MM）
  if (d.length === 7) {
    var ymStart = d + '-01', ymEnd = d + '-31';
    if (s.startDate && s.startDate > ymEnd) return false;
    if (s.endDate && s.endDate < ymStart) return false;
    if (['退職', '退職済', '離職', '利用終了', '退所'].indexOf(st) >= 0 || s.isRetired === true) {
      if (!s.endDate && d >= td.slice(0, 7)) return false;
    }
    return true;
  }

  // 日付指定または現在判定（YYYY-MM-DD: 入職日から退職日の間）
  if (s.startDate && s.startDate > d) return false;
  if (s.endDate && s.endDate < d) return false;
  if (['退職', '退職済', '離職', '利用終了', '退所'].indexOf(st) >= 0 || s.isRetired === true) {
    if (!s.endDate || s.endDate <= d) return false;
  }
  return true;
}

function renderTbStaffCards(){
  var grid = el('tb-staff-card-grid');
  if (!grid) return;
  var activeStaff = TB_STAFF_LIST.filter(function(s){
    return isStaffActive(s);
  });
  if (activeStaff.length === 0) {
    grid.innerHTML = '<div style="text-align:center;color:var(--sub);padding:16px">対象のスタッフが見つかりません</div>';
    return;
  }
  grid.innerHTML = activeStaff.map(function(s){
    var initial = esc(s.name ? s.name.charAt(0) : '?');
    var role = esc(s.role || 'スタッフ');
    return '<div class="tb-staff-card" onclick="selectTbStaff(\'' + s.id + '\')">' +
      '<div style="width:42px;height:42px;border-radius:50%;background:var(--pri);color:#fff;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 6px">' + initial + '</div>' +
      '<div style="font-size:13px;font-weight:700;color:var(--txt);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(s.name) + '</div>' +
      '<div style="font-size:10px;color:var(--sub);background:#fff;padding:2px 6px;border-radius:8px;display:inline-block">' + role + '</div>' +
    '</div>';
  }).join('');
}

function showTbCardView(){
  _selectedTbStaff = null;
  _tbPinInput = '';
  hide('tb-pin-view');
  hide('tb-trad-view');
  show('tb-card-view');
}

function showTbTradLogin(){
  _selectedTbStaff = null;
  _tbPinInput = '';
  hide('tb-card-view');
  hide('tb-pin-view');
  show('tb-trad-view');
}

function selectTbStaff(staffId){
  var staff = TB_STAFF_LIST.find(function(s){ return String(s.id) === String(staffId); });
  if (!staff) return;
  _selectedTbStaff = staff;
  _tbPinInput = '';
  
  el('tb-pin-avatar').textContent = staff.name ? staff.name.charAt(0) : '?';
  el('tb-pin-name').textContent = staff.name || '';
  el('tb-pin-role').textContent = staff.role || 'スタッフ';
  el('tb-pin-err').style.display = 'none';
  el('tb-pin-err').textContent = '';
  
  updateTbPinDots();
  hide('tb-card-view');
  hide('tb-trad-view');
  show('tb-pin-view');
}

function updateTbPinDots(){
  var dots = document.querySelectorAll('#tb-pin-dots .pin-dot');
  var len = _tbPinInput.length;
  dots.forEach(function(dot, idx){
    if (idx < len) {
      dot.style.background = 'var(--pri)';
      dot.style.borderColor = 'var(--pri)';
    } else {
      dot.style.background = '#fff';
      dot.style.borderColor = '#ccc';
    }
  });
}

function pressTbPinKey(num){
  var errEl = el('tb-pin-err');
  if (errEl) errEl.style.display = 'none';
  if (_tbPinInput.length >= 4) return;
  _tbPinInput += num;
  updateTbPinDots();
  if (_tbPinInput.length === 4) {
    setTimeout(verifyTbPinInput, 150);
  }
}

function backspaceTbPinKey(){
  if (_tbPinInput.length > 0) {
    _tbPinInput = _tbPinInput.slice(0, -1);
    updateTbPinDots();
  }
}

function clearTbPinKey(){
  _tbPinInput = '';
  updateTbPinDots();
}

async function verifyTbPinInput(){
  if (!_selectedTbStaff || _tbPinInput.length !== 4) return;
  var s = _selectedTbStaff;
  var enteredPin = _tbPinInput;
  var targetPw = String(s.password || '').trim();
  var targetId = String(s.loginId || '').trim();
  var errEl = el('tb-pin-err');
  
  if (targetPw === enteredPin || targetId === enteredPin) {
    if (!isStaffActive(s)) {
      if (errEl) {
        errEl.style.display = 'block';
        errEl.textContent = '現在利用期間外のスタッフです（入職日前または退職後）';
      }
      _tbPinInput = '';
      updateTbPinDots();
      return;
    }
    ME = s;
    try { sessionStorage.setItem('tb_me', JSON.stringify(ME)); } catch(e){}
    await boot();
  } else {
    if (errEl) {
      errEl.style.display = 'block';
      errEl.textContent = '暗証番号（PIN）が違います';
    }
    _tbPinInput = '';
    updateTbPinDots();
  }
}

el('btn-login').onclick = async function(){
  var id=el('inp-id').value.trim(), pw=el('inp-pw').value;
  var err=el('login-err'), btn=this;
  err.textContent='';
  if(!id||!pw){err.textContent='IDとパスワードを入力してください';return;}
  btn.disabled=true; btn.textContent='確認中...';
  try{
    var staffList=await gas('getStaff');
    var found=null;
    if(staffList && Array.isArray(staffList)){
      for(var i=0; i<staffList.length; i++){
        if(String(staffList[i].loginId||'').trim()===id && String(staffList[i].password||'').trim()===pw){
          found=staffList[i]; break;
        }
      }
    }
    if(!found){err.textContent='IDまたはパスワードが違います';return;}
    if(!isStaffActive(found)){
      err.textContent='このアカウントは現在利用期間外です（入職日前または退職後）';
      return;
    }
    ME=found;
    try{sessionStorage.setItem('tb_me',JSON.stringify(ME));}catch(e){}
    await boot();
  }catch(e){ err.textContent='エラー: '+(e.message||String(e)); }
  finally{ btn.disabled=false; btn.textContent='ログイン'; }
};
el('inp-pw').onkeydown=function(e){if(e.key==='Enter')el('btn-login').onclick();};

el('btn-logout').onclick=function(){
  try{sessionStorage.removeItem('tb_me');}catch(e){}
  ME=null;
  showTbCardView();
  hide('pg-main'); el('pg-login').style.display='flex';
};

loadTbStaffCards();

// ─── 起動 ────────────────────────────
async function boot(){
  el('pg-login').style.display='none';
  hide('pg-main'); show('pg-loading');
  try{
    var results=await Promise.all([
      gas('getUsers'),
      gas('getWorkTypes'),
      gas('getTemplates'),
      gas('getSettings')
    ]);
    USERS=results[0]||[];
    WORK_TYPES=results[1]||[];
    TEMPLATES=results[2]||[];
    SETTINGS=results[3]||{};

    // UI構築
    document.body.classList.remove('mobile-view-form');
    document.body.classList.add('mobile-view-list');
    el('hd-staff').textContent='👤 '+(ME.name||'');
    buildUserSelect();
    buildWorkTypeSelect();
    buildTemplateSelect();
    el('sel-date').value=today();
    el('sel-date').max=today();

    // サイドバー構築
    await fetchAttendanceForDate(el('sel-date').value);
    await renderUserList();
    el('sel-date').onchange=async function(){
      delete ATTENDANCE_CACHE[this.value];
      delete TEMP_CACHE[this.value];
      await fetchAttendanceForDate(this.value);
      await renderUserList();
    };
    el('search-box').oninput=function(){ renderUserList(); };

    show('pg-main');
    hide('pg-loading');

    try {
      var _tqp = new URLSearchParams(window.location.search);
      if(_tqp.get('view') === 'haccp' || _tqp.get('tab') === 'haccp'){
        switchTabletView('haccp');
      }
    } catch(err){}
  }catch(e){
    hide('pg-loading');
    el('pg-login').style.display='flex';
    alert('読み込みエラー: '+(e.message||String(e)));
  }
}

// ─── タブレット日跨ぎ自動同期 ───
window._lastTabletDate = today();
function checkTabletDateRollover(){
  var cur = today();
  if(window._lastTabletDate !== cur){
    window._lastTabletDate = cur;
    var sel = el('sel-date');
    if(sel){
      sel.max = cur;
      if(sel.value < cur){
        sel.value = cur;
        delete ATTENDANCE_CACHE[cur];
        delete TEMP_CACHE[cur];
        fetchAttendanceForDate(cur).then(renderUserList);
      }
    }
  }
}
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible') checkTabletDateRollover();
});
window.addEventListener('focus', checkTabletDateRollover);
setInterval(checkTabletDateRollover, 30000);

// セッション復元
(async function(){
  try{
    var s=sessionStorage.getItem('tb_me');
    if(s){ME=JSON.parse(s); await boot();}
  }catch(e){try{sessionStorage.removeItem('tb_me');}catch(e2){}}
})();

// ─── UI構築 ──────────────────────────
function buildUserSelect(){
  var sel=el('sel-user');
  if(!sel)return;
  sel.innerHTML='<option value="">-- 利用者を選択 --</option>';
  USERS.forEach(function(u){
    var opt=document.createElement('option');
    opt.value=u.id;
    opt.textContent=u.name+(u.kana?' ('+u.kana+')':'');
    sel.appendChild(opt);
  });
}

async function fetchAttendanceForDate(date){
  if(!date)return;
  try{
    var results=await Promise.all([
      gas('getAttendanceByDate', date),
      gas('getDailyByDate', date),
      gas('getTempByDate', date)
    ]);
    var attList=results[0]||[];
    var repList=results[1]||[];
    var tempList=results[2]||[];
    var map={};
    if(attList && Array.isArray(attList)){
      attList.forEach(function(a){
        if(a && a.userId) map[String(a.userId).trim()]=Object.assign({}, a);
      });
    }
    if(repList && Array.isArray(repList)){
      repList.forEach(function(r){
        if(r && r.userId){
          var uKey=String(r.userId).trim();
          if(!map[uKey]) map[uKey]={ userId: r.userId, date: date, status: '出席' };
          map[uKey].content=r.content||r.notes||'';
        }
      });
    }
    ATTENDANCE_CACHE[date]=map;

    var tempMap={};
    if(tempList && Array.isArray(tempList)){
      tempList.forEach(function(t){
        if(t && t.userId) tempMap[String(t.userId).trim()]=t;
      });
    }
    TEMP_CACHE[date]=tempMap;
  }catch(e){
    console.error('fetchAttendanceForDate error:', e);
    ATTENDANCE_CACHE[date]={};
    TEMP_CACHE[date]={};
  }
}

function isTempUser(user, date){
  if(!date)return false;
  var uKey=String(user.id||'').trim();
  var tempMap=TEMP_CACHE[date]||{};
  if(tempMap[uKey]) return true;

  var sc=(typeof getUserScheduleForDate==='function')?getUserScheduleForDate(user,date):user;
  var sd=(sc.scheduleDays||'').split(',').map(function(s){return s.trim();}).filter(Boolean);
  var dow=['日','月','火','水','木','金','土'][new Date(date).getDay()];
  var isRegularScheduled = sd.indexOf(dow)>=0;

  var attMap=ATTENDANCE_CACHE[date]||{};
  var att=attMap[uKey];
  if(!isRegularScheduled && att && ['出席','遅刻','早退','予定'].indexOf(att.status)>=0) return true;
  return false;
}

function isScheduledToday(user, date){
  if(!date)return false;
  if(user.userStatus==='利用終了')return false;
  if(user.enrollDate&&user.enrollDate>date)return false;
  if(user.endDate&&user.endDate<date)return false;
  var attMap=ATTENDANCE_CACHE[date]||{};
  var uKey=String(user.id||'').trim();
  var att=attMap[uKey];
  if(att && (att.status==='調整休'||att.status==='欠席'||att.status==='体調不良'||att.status==='通院')){
    return false;
  }
  // 臨時利用登録があるか
  if(isTempUser(user, date)) return true;

  // すでに出欠記録（出席・遅刻・早退・予定等）があるか
  if(att && ['出席','遅刻','早退','予定'].indexOf(att.status)>=0) return true;

  // 通常スケジュール曜日か
  var sc=(typeof getUserScheduleForDate==='function')?getUserScheduleForDate(user,date):user;
  var sd=(sc.scheduleDays||'').split(',').map(function(s){return s.trim();}).filter(Boolean);
  if(sd.length===0)return false;
  var dow=['日','月','火','水','木','金','土'][new Date(date).getDay()];
  return sd.indexOf(dow)>=0;
}

var _showUnscheduledTablet = false;

async function renderUserList(){
  var kw=el('search-box').value.trim();
  var date=el('sel-date').value;
  var curId=el('sel-user').value;

  if(date && (!ATTENDANCE_CACHE[date] || Object.keys(ATTENDANCE_CACHE[date]).length===0)){
    await fetchAttendanceForDate(date);
  }
  var attMap=ATTENDANCE_CACHE[date]||{};

  var list=USERS.filter(function(u){
    if(u.userStatus==='利用終了')return false;
    if(u.enrollDate&&u.enrollDate>date)return false;
    if(u.endDate&&u.endDate<date)return false;
    if(!kw)return true;
    return(u.name||'').indexOf(kw)>=0||(u.kana||'').indexOf(kw)>=0||(u.furigana||'').indexOf(kw)>=0;
  });

  // 1. 本日の予定者（通常予定・臨時利用・出勤者）
  var scheduled=list.filter(function(u){return isScheduledToday(u,date);});

  // 2. 欠席・お休みの利用者（実際に欠席等の記録がある人のみ）
  var absents=list.filter(function(u){
    var att=attMap[String(u.id||'').trim()];
    return att && ['欠席','体調不良','通院'].indexOf(att.status)>=0;
  });

  // 3. その他（本日予定なし）
  var unscheduled=list.filter(function(u){
    if(isScheduledToday(u,date)) return false;
    var att=attMap[String(u.id||'').trim()];
    if(att && ['欠席','体調不良','通院','調整休'].indexOf(att.status)>=0) return false;
    return true;
  });

  function makeItem(u){
    var isActive=String(u.id)===String(curId);
    var att=attMap[String(u.id||'').trim()];
    var badges=[];

    var cleanNotes = cleanNotesText(att ? att.notes : '');
    var cleanContent = cleanNotesText(att ? att.content : '');
    var isInputFilled = cleanNotes.length > 0 || cleanContent.length > 0;

    if(isTempUser(u, date)){
      badges.push('<span class="u-badge" style="background:#fff3e0;color:#e65100;border:1px solid #ffe0b2;font-weight:700">⚡ 臨時</span>');
    }

    if(att && ['欠席','体調不良','通院'].indexOf(att.status)>=0){
      badges.push('<span class="u-badge" style="color:#c62828;font-weight:700">❌ '+esc(att.status)+'</span>');
    }else if(att && att.status==='調整休'){
      badges.push('<span class="u-badge saved" style="background:#757575;color:#fff">☕ 調整休</span>');
    }else if(isInputFilled){
      badges.push('<span class="u-badge saved">✅ 入力済</span>');
    }
    return '<div class="user-item'+(isActive?' active':'')+
      '" data-uid="'+u.id+'" onclick="selectUser(this.getAttribute(\'data-uid\'))">'  
      +'<span class="u-name">'+esc(u.name)+'</span>'
      +badges.join(' ')
      +'</div>';
  }

  var html='';
  if(scheduled.length>0){
    html+='<div style="padding:6px 14px 4px;font-size:10px;font-weight:700;color:var(--pri);background:#f0f7f0;border-bottom:1px solid #d4e8d4">📅 本日の予定者 ('+scheduled.length+'名)</div>';
    scheduled.forEach(function(u){html+=makeItem(u);});
  }
  if(absents.length>0){
    html+='<div style="padding:6px 14px 4px;font-size:10px;font-weight:700;color:#c62828;background:#ffebee;border-bottom:1px solid #ffcdd2">❌ 欠席・お休み ('+absents.length+'名)</div>';
    absents.forEach(function(u){html+=makeItem(u);});
  }
  if(unscheduled.length>0){
    if(kw || _showUnscheduledTablet || (scheduled.length===0 && absents.length===0)){
      html+='<div style="padding:6px 14px 4px;font-size:10px;font-weight:700;color:#666;background:#f5f5f5;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center">'
        +'<span>💤 本日予定なし ('+unscheduled.length+'名)</span>'
        +(kw?'':'<button onclick="_showUnscheduledTablet=false;renderUserList();" style="border:none;background:transparent;color:#888;cursor:pointer;font-size:10px">閉じる▲</button>')
        +'</div>';
      unscheduled.forEach(function(u){html+=makeItem(u);});
    } else {
      html+='<div style="padding:10px 14px;text-align:center"><button onclick="_showUnscheduledTablet=true;renderUserList();" style="background:#f5f5f5;border:1px solid #ddd;border-radius:6px;padding:6px 12px;font-size:11px;color:#666;cursor:pointer">▼ 本日予定なしの利用者 ('+unscheduled.length+'名) を表示</button></div>';
    }
  }
  el('user-list').innerHTML=html||'<p style="padding:16px;color:var(--sub);font-size:12px">該当者なし</p>';
}

function resolveWtId(v){
  if(!v || v==='none' || v==='なし' || v==='作業なし') return 'none';
  var found=WORK_TYPES.find(function(w){return String(w.id)===String(v) || w.name===v;});
  return found ? found.id : v;
}

function showMobileUserList(){
  document.body.classList.remove('mobile-view-form');
  document.body.classList.add('mobile-view-list');
  hide('form-area');
  hide('pg-done');
  show('pg-empty');
  el('sel-user').value='';
  renderUserList();
  window.scrollTo(0,0);
}

async function selectUser(userId){
  el('sel-user').value=userId;
  renderUserList();
  var date=el('sel-date').value;
  if(!date){alert('日付を選択してください');return;}
  var user=USERS.find(function(u){return String(u.id)===String(userId);});
  if(!user)return;

  document.body.classList.remove('mobile-view-list');
  document.body.classList.add('mobile-view-form');
  window.scrollTo(0,0);

  hide('pg-empty');
  hide('pg-done');
  show('form-area');
  el('form-area').innerHTML='<p style="text-align:center;padding:40px;color:var(--sub)">読み込み中...</p>';

  try{
    var attList=await gas('getAttendanceByDate', date);
    var repList=await gas('getDailyByDate', date);
    var att=(attList && Array.isArray(attList)) ? attList.find(function(a){ return String(a.userId)===String(userId); }) : null;
    var rep=(repList && Array.isArray(repList)) ? repList.find(function(d){ return String(d.userId)===String(userId); }) : null;

    el('form-area').innerHTML=buildFormHTML();

    // イベント再設定
    var startInput = el('f-start');
    var endInput = el('f-end');
    var breakInput = el('f-break');
    if(startInput) startInput.oninput=updateWorkTimeBadge;
    if(endInput) endInput.oninput=updateWorkTimeBadge;
    if(breakInput) breakInput.onchange=updateWorkTimeBadge;

    buildWorkTypeSelect();
    buildTemplateSelect();

    // 値をセット
    CURRENT_STATUS=att?att.status||'出席':'出席';
    document.querySelectorAll('.status-opt').forEach(function(b){
      b.classList.remove('on');
      if(b.getAttribute('data-val')===CURRENT_STATUS)b.classList.add('on');
    });
    if(startInput) startInput.value = att ? att.startTime||'' : '';
    if(endInput) endInput.value = att ? att.endTime||'' : '';
    var sc = (typeof getUserScheduleForDate === 'function') ? getUserScheduleForDate(user, date) : (user || {});
    var defaultBreak = (sc && sc.breakMin !== undefined && sc.breakMin !== null && sc.breakMin !== '') ? String(sc.breakMin) : '60';
    if(breakInput) breakInput.value = (att && att.breakMin !== undefined && att.breakMin !== null && att.breakMin !== '') ? String(att.breakMin) : defaultBreak;

    // お弁当
    var bentoVal = 'なし';
    var rawBento = (att && att.bento) ? att.bento : (sc ? sc.bento : '');
    if(rawBento){
      var bs = String(rawBento).trim();
      if(bs==='3食'||bs==='3'||bs==='3個') bentoVal = '3食';
      else if(bs==='2食'||bs==='2'||bs==='2個') bentoVal = '2食';
      else if(bs==='1食'||bs==='1'||bs==='1個'||bs==='あり'||bs==='true') bentoVal = '1食';
    }
    if(el('f-bento')) el('f-bento').value = bentoVal;
    var mealRateVal = (att && att.mealRate) ? att.mealRate : (bentoVal !== 'なし' ? '10割' : '-');
    if(el('f-meal-rate')) el('f-meal-rate').value = mealRateVal;

    // 送迎
    var transportVal = 'なし';
    var rawPickup = (att && att.pickup) ? att.pickup : (sc ? sc.pickup : '');
    if(rawPickup){
      var pStr = String(rawPickup);
      if(pStr === '往復' || pStr === 'あり' || (att && att.pickup && att.dropoff)) transportVal = '往復';
      else if(pStr.indexOf('往')>=0 || pStr.indexOf('迎')>=0) transportVal = '往路';
      else if(pStr.indexOf('復')>=0 || pStr.indexOf('送')>=0) transportVal = '復路';
      else if(pStr === 'true' || rawPickup === true) transportVal = '往復';
    }
    if(el('f-transport')) el('f-transport').value = transportVal;
    window._tbCurNotesMeta = extractAuthorMeta(att ? (att.notes||'') : '');
    window._tbCurContentMeta = extractAuthorMeta(rep ? (rep.content||'') : '');

    if(el('f-att-notes')) el('f-att-notes').value = att ? cleanNotesText(att.notes||'') : '';
    if(el('f-notes-author')) el('f-notes-author').innerHTML = renderAuthorBadgeHTML(window._tbCurNotesMeta);

    // 作業種別 AM / PM
    var rawAm = rep ? (rep.workTypeId || rep.workAM) : (att ? att.workTypeId : (sc ? sc.workTypeId : ''));
    var rawPm = rep ? (rep.workTypeIdPm || rep.workPM) : (att ? (att.workTypeIdPm || att.workTypeId) : (sc ? sc.workTypeIdPm : ''));

    if(el('f-work-am')) el('f-work-am').value = resolveWtId(rawAm);
    if(el('f-work-pm')) el('f-work-pm').value = resolveWtId(rawPm);

    if(el('f-content')) el('f-content').value = rep ? cleanNotesText(rep.content||'') : '';
    if(el('f-content-author')) el('f-content-author').innerHTML = renderAuthorBadgeHTML(window._tbCurContentMeta);
    if(el('f-condition')) el('f-condition').value = rep ? (rep.condition || rep.mood || '普通') : '普通';

    var labelEl = el('user-date-label');
    if(labelEl) labelEl.textContent = esc(user.name) + ' — ' + fmtDateJP(date);
    updateWorkTimeBadge();
  }catch(e){
    el('form-area').innerHTML='<p style="color:#c62828;padding:20px">読み込みエラー: '+esc(e.message||String(e))+'</p>';
  }
}

function buildWorkTypeSelect(){
  var opts='<option value="">-- 選択 --</option><option value="none">なし（作業なし・午前帰宅等）</option>';
  WORK_TYPES.forEach(function(w){
    opts+='<option value="'+esc(w.id)+'">'+esc(w.name)+'</option>';
  });
  var amEl = el('f-work-am');
  var pmEl = el('f-work-pm');
  if(amEl) amEl.innerHTML=opts;

function buildTemplateSelect(){
  var sel=el('f-template');
  if(!sel)return;
  sel.innerHTML='<option value="">📋 テンプレートから入力...</option>';
  TEMPLATES.forEach(function(t){
    var opt=document.createElement('option');
    opt.value=t.content||'';
    opt.textContent=t.name||'';
    sel.appendChild(opt);
  });
}

// ─── 状態選択 ────────────────────────
function setStatus(btn){
  CURRENT_STATUS=btn.getAttribute('data-val');
  document.querySelectorAll('.status-opt').forEach(function(b){
    b.classList.remove('on');
  });
  btn.classList.add('on');
  if(['欠席','体調不良','通院'].indexOf(CURRENT_STATUS)>=0){
    if(el('f-meal-rate')) el('f-meal-rate').value = '-';
  } else if(['出席','遅刻','早退'].indexOf(CURRENT_STATUS)>=0){
    onBentoChangeTablet();
  }
}

// ─── テンプレート適用 ──────────────────
function applyTemplate(){
  var val=el('f-template').value;
  if(!val)return;
  var cur=el('f-content').value;
  el('f-content').value=cur?(cur+'\n'+val):val;
  el('f-template').value='';
}

// ─── キャンセル ──────────────────────
function cancelForm(){
  showMobileUserList();
}

function onBentoChangeTablet(){
  var b = el('f-bento') ? el('f-bento').value : 'なし';
  var mr = el('f-meal-rate');
  if(!mr) return;
  if(b !== 'なし'){
    if(mr.value === '-' || !mr.value) mr.value = '10割';
  } else {
    mr.value = '-';
  }
}

// ─── 保存 ────────────────────────────
async function saveForm(){
  var userId=el('sel-user').value;
  var date=el('sel-date').value;
  if(!userId||!date)return;
  var btn=el('btn-save');btn.disabled=true;btn.textContent='保存中...';

  try{
    var transport=el('f-transport').value;
    var selAm=el('f-work-am').value;
    var selPm=el('f-work-pm').value;
    var amTypeId=(selAm&&selAm!=='none')?selAm:null;
    var pmTypeId=(selPm&&selPm!=='none')?selPm:null;

    var userObj=USERS.find(function(u){return String(u.id)===String(userId);});

    var curStaffName = (ME && ME.name) ? ME.name : '';
    var rawNotes = el('f-att-notes') ? el('f-att-notes').value : '';
    var finalNotes = buildAuthorText(rawNotes, window._tbCurNotesMeta, curStaffName);
    var rawContent = el('f-content') ? el('f-content').value : '';
    var finalContent = buildAuthorText(rawContent, window._tbCurContentMeta, curStaffName);

    // 出欠データ
    var attData={
      userId: userId,
      date: date,
      status: CURRENT_STATUS,
      startTime: el('f-start').value || null,
      endTime: el('f-end').value || null,
      breakMin: (el('f-break')&&el('f-break').value!=='')?parseInt(el('f-break').value):60,
      workTypeId: amTypeId,
      workTypeIdPm: pmTypeId,
      bento: el('f-bento').value,
      mealRate: (['出席','遅刻','早退'].indexOf(CURRENT_STATUS)>=0 && el('f-bento') && el('f-bento').value !== 'なし') ? (el('f-meal-rate') ? el('f-meal-rate').value : '10割') : '-',
      bentoPaymentMethod: userObj ? (userObj.bentoPaymentMethod || '工賃払い') : '工賃払い',
      pickup: transport,
      notes: finalNotes || null
    };

    // 日報データ
    var repData={
      userId: userId,
      date: date,
      workTypeId: amTypeId,
      workTypeIdPm: pmTypeId,
      content: finalContent || '',
      condition: el('f-condition').value || '普通',
      mood: el('f-condition').value || '普通',
      notes: finalContent || null
    };

    await Promise.all([
      gas('upsertAttendance', attData),
      gas('upsertDailyReport', repData)
    ]);

    window._tbCurNotesMeta = null;
    window._tbCurContentMeta = null;

    // 完了表示
    SAVED_DATES[userId+'_'+date]=true;
    if(!ATTENDANCE_CACHE[date]) ATTENDANCE_CACHE[date]={};
    ATTENDANCE_CACHE[date][String(userId)]=Object.assign({}, attData, { content: repData.content });
    await renderUserList();
    var user=USERS.find(function(u){return String(u.id)===String(userId);});
    el('done-msg').textContent=(user?user.name:'')+' の日報を保存しました';
    hide('form-area');
    show('pg-done');
    window.scrollTo(0,0);
  }catch(e){
    alert('保存エラー: '+(e.message||String(e)));
  }finally{
    btn.disabled=false;btn.textContent='💾 出欠・日報を保存';
  }
}

// Supabase JSONストレージ ヘルパー
async function getHaccpJson(key, defVal){
  try {
    var sb = (typeof _getSupabase === 'function') ? _getSupabase() : supabase;
    if(!sb && window.supabase && window.supabase.createClient){
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }
    var r = await sb.from('設定').select('value').eq('key', key).limit(1);
    if(r.data && r.data.length > 0 && r.data[0].value){
      return JSON.parse(r.data[0].value);
    }
  } catch(e){
    console.warn('getHaccpJson (' + key + '):', e);
  }
  return defVal;
}

async function saveHaccpJson(key, data){
  try {
    var sb = (typeof _getSupabase === 'function') ? _getSupabase() : supabase;
    if(!sb && window.supabase && window.supabase.createClient){
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }
    var valStr = JSON.stringify(data);
    var chk = await sb.from('設定').select('key').eq('key', key).limit(1);
    if(chk.data && chk.data.length > 0){
      var ur = await sb.from('設定').update({ value: valStr }).eq('key', key);
      if(ur.error) throw ur.error;
    } else {
      var ir = await sb.from('設定').insert([{ key: key, value: valStr }]);
      if(ir.error) throw ir.error;
    }
    return true;
  } catch(e){
    console.error('saveHaccpJson (' + key + '):', e);
    throw e;
  }
}

function renderHaccpCard(){
  var box = el('haccp-card-box');
  if(!box) return;

  var step = _haccpState.step;
  var totalSteps = 6;
  var h = '';

  // ─── ステップ 0: 作業者選択 ───
  if(step === 0){
    h += '<div class="haccp-step-badge">ステップ 1 / 2 ： 作業者の選択</div>';
    h += '<div class="haccp-icon">👤</div>';
    h += '<div class="haccp-q-title">きょう作業する人はだれですか？</div>';
    h += '<div class="haccp-q-desc">自分の名前をタップしてください。</div>';
    h += '<div class="haccp-user-grid">';
    var activeUsers = (USERS || []).filter(function(u){ return String(u.status) !== '利用終了'; });
    activeUsers.forEach(function(u){
      h += '<button type="button" class="haccp-user-btn" onclick="selectHaccpWorker(\''+esc(u.id)+'\',\''+esc(u.name)+'\')">'+esc(u.name)+'</button>';
    });
    h += '</div>';
    h += '<div style="margin-top:12px;font-size:12px;color:var(--sub)">※コーヒー作業（生豆ピッキング・焙煎・計量包装等）の担当者</div>';
    box.innerHTML = h;
    return;
  }

  // ─── ステップ 1〜6: 質問カード ───
  if(step >= 1 && step <= 6){
    var q = HACCP_QUESTIONS[step];

    // プログレスバー
    h += '<div style="display:flex;justify-content:space-between;width:100%;align-items:center;margin-bottom:6px">';
    h += '  <button type="button" onclick="prevHaccpStep()" style="background:none;border:1px solid var(--bdr);border-radius:12px;padding:4px 10px;font-size:12px;color:var(--sub);cursor:pointer">← 前へ</button>';
    h += '  <div class="haccp-step-badge" style="margin-bottom:0">質問 ' + step + ' / ' + totalSteps + '</div>';
    h += '  <div style="font-size:12px;font-weight:700;color:var(--pri)">作業者: ' + esc(_haccpState.workerName) + '</div>';
    h += '</div>';

    // ドットプログレス
    h += '<div class="haccp-progress-bar">';
    for(var i = 1; i <= totalSteps; i++){
      var cls = 'haccp-dot';
      if(i < step) cls += ' passed';
      else if(i === step) cls += ' active';
      h += '<span class="'+cls+'"></span>';
    }
    h += '</div>';

    // 質問内容
    h += '<div class="haccp-icon">' + q.icon + '</div>';
    h += '<div class="haccp-q-title">' + q.title + '</div>';
    h += '<div class="haccp-q-desc">' + q.desc + '</div>';

    // ボタン列
    h += '<div class="haccp-btn-row">';
    h += '  <button type="button" class="haccp-btn-yes" onclick="answerHaccpStep(\''+q.key+'\',\'良\')">' + q.yesText + '</button>';
    h += '  <button type="button" class="haccp-btn-no" onclick="answerHaccpStep(\''+q.key+'\',\'不良\')">' + q.noText + '</button>';
    h += '</div>';

    box.innerHTML = h;
    return;
  }

  // ─── ステップ 7: 完了確認・保存カード ───
  if(step === 7){
    var hasDefect = (
      _haccpState.healthCheck === '不良' ||
      _haccpState.handWash === '不良' ||
      _haccpState.tableClean === '不良' ||
      _haccpState.pestForeign === '不良' ||
      _haccpState.areaSeparation === '不良' ||
      _haccpState.fireSafety === '不良'
    );

    var curStaff = _haccpState.staffName || (ME && ME.name) || '';

    h += '<div style="display:flex;justify-content:flex-start;width:100%;margin-bottom:4px">';
    h += '  <button type="button" onclick="prevHaccpStep()" style="background:none;border:1px solid var(--bdr);border-radius:12px;padding:4px 10px;font-size:12px;color:var(--sub);cursor:pointer">← 戻る</button>';
    h += '</div>';

    h += '<div class="haccp-icon">' + (hasDefect ? '⚠️' : '🎉') + '</div>';
    h += '<div class="haccp-q-title">' + (hasDefect ? 'チェック完了（要確認事項あり）' : '衛生チェック完了！') + '</div>';
    h += '<div class="haccp-q-desc">' +
           esc(_haccpState.workerName) + ' さん、おつかれさまでした！<br>' +
           (hasDefect ? '<span style="color:#c62828;font-weight:700">※不良と回答した項目があります。担当職員に確認してください。</span>' : 'きょうも安全においしいコーヒーを作りましょう！') +
         '</div>';

    // サマリー表示
    h += '<div style="width:100%;max-width:480px;background:#f9f8f5;border:1.5px solid var(--bdr);border-radius:14px;padding:12px 16px;text-align:left;font-size:13px;margin-bottom:16px">';
    h += '  <div style="font-weight:700;margin-bottom:6px;color:var(--pri);border-bottom:1px solid #eee;padding-bottom:4px">【入力結果の確認】</div>';
    h += '  <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:12px">';
    h += '    <div>体調手指: <b style="color:'+(_haccpState.healthCheck==='良'?'#2e7d32':'#c62828')+'">'+_haccpState.healthCheck+'</b></div>';
    h += '    <div>手洗い消毒: <b style="color:'+(_haccpState.handWash==='良'?'#2e7d32':'#c62828')+'">'+_haccpState.handWash+'</b></div>';
    h += '    <div>専用台器具: <b style="color:'+(_haccpState.tableClean==='良'?'#2e7d32':'#c62828')+'">'+_haccpState.tableClean+'</b></div>';
    h += '    <div>害虫異物: <b style="color:'+(_haccpState.pestForeign==='良'?'#2e7d32':'#c62828')+'">'+_haccpState.pestForeign+'</b></div>';
    h += '    <div>作業区分: <b style="color:'+(_haccpState.areaSeparation==='良'?'#2e7d32':'#c62828')+'">'+_haccpState.areaSeparation+'</b></div>';
    h += '    <div>設備火気: <b style="color:'+(_haccpState.fireSafety==='良'?'#2e7d32':'#c62828')+'">'+_haccpState.fireSafety+'</b></div>';
    h += '  </div>';

    // 特記事項
    h += '  <div style="margin-top:10px">';
    h += '    <label style="display:block;font-size:11px;font-weight:700;color:var(--sub);margin-bottom:3px">特記事項・異常対応メモ（任意）:</label>';
    h += '    <input type="text" id="haccp-wizard-notes" placeholder="異常内容や対応があれば入力" value="'+esc(_haccpState.notes)+'" style="width:100%;padding:6px 8px;border:1px solid var(--bdr);border-radius:6px;font-size:13px" onchange="_haccpState.notes=this.value">';
    h += '  </div>';

    // 職員確認
    h += '  <div style="margin-top:8px">';
    h += '    <label style="display:block;font-size:11px;font-weight:700;color:var(--sub);margin-bottom:3px">確認職員名:</label>';
    h += '    <input type="text" id="haccp-wizard-staff" value="'+esc(curStaff)+'" placeholder="確認した職員の氏名" style="width:100%;padding:6px 8px;border:1px solid var(--bdr);border-radius:6px;font-size:13px" onchange="_haccpState.staffName=this.value">';
    h += '  </div>';
    h += '</div>';

    // 保存ボタン
    h += '<div style="width:100%;max-width:480px">';
    h += '  <button type="button" id="btn-save-haccp-wizard" onclick="submitHaccpWizard()" style="width:100%;padding:16px;background:var(--pri);color:#fff;border:none;border-radius:16px;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 4px 16px rgba(61,90,62,0.35)">💾 衛生記録を保存する</button>';
    h += '</div>';

    box.innerHTML = h;
    return;
  }
}

async function submitHaccpWizard(){
  var btn = el('btn-save-haccp-wizard');
  if(btn){ btn.disabled = true; btn.textContent = '保存中...'; }

  try {
    var todayStr = today();
    var ym = todayStr.slice(0,7);
    var key = 'haccp_hygiene_' + ym;

    var notesEl = el('haccp-wizard-notes');
    var staffEl = el('haccp-wizard-staff');
    if(notesEl) _haccpState.notes = notesEl.value;
    if(staffEl) _haccpState.staffName = staffEl.value;

    var record = {
      id: 'hh_' + Date.now() + Math.random().toString(36).substr(2,4),
      date: todayStr,
      workerId: _haccpState.workerId,
      workerName: _haccpState.workerName,
      healthCheck: _haccpState.healthCheck,
      handWash: _haccpState.handWash,
      tableClean: _haccpState.tableClean,
      pestForeign: _haccpState.pestForeign,
      areaSeparation: _haccpState.areaSeparation,
      fireSafety: _haccpState.fireSafety,
      afterClean: _haccpState.afterClean || '良',
      notes: _haccpState.notes || '',
      staffName: _haccpState.staffName || (ME && ME.name) || '友田 篤賜',
      createdAt: new Date().toISOString()
    };

    var list = await getHaccpJson(key, []);
    list.unshift(record);
    await saveHaccpJson(key, list);

    // 成功演出
    var box = el('haccp-card-box');
    if(box){
      box.innerHTML = '<div class="haccp-icon">✨</div>' +
        '<div class="haccp-q-title" style="color:var(--pri)">保存しました！</div>' +
        '<div class="haccp-q-desc">' + esc(record.workerName) + ' さんの本日の衛生記録をSupabaseに安全に保存しました。</div>' +
        '<div style="margin-top:20px;display:flex;gap:12px;width:100%;max-width:400px">' +
        '  <button type="button" class="haccp-btn-yes" onclick="resetHaccpWizard()" style="padding:14px;font-size:16px">👤 別の人のチェックを行う</button>' +
        '  <button type="button" class="haccp-btn-no" onclick="switchHaccpSubTab(\'list\')" style="padding:14px;font-size:15px">📋 一覧を見る</button>' +
        '</div>';
    }
  } catch(e){
    alert('保存エラー: ' + (e.message || String(e)));
    if(btn){ btn.disabled = false; btn.textContent = '💾 衛生記録を保存する'; }
  }
}

    '    <div style="font-weight:700;font-size:13px;color:var(--pri);margin-bottom:10px">③ 包装・出荷記録（計量・密封・表示・出荷）</div>' +
    '    <div class="grid3">' +
    '      <div class="field"><label>包装日</label><input type="date" id="hr-pack-date" value="'+todayStr+'"></div>' +
    '      <div class="field"><label>形態</label><select id="hr-pack-type"><option value="豆">豆</option><option value="粉">粉（中挽き等）</option><option value="ドリップバッグ">ドリップバッグ</option></select></div>' +
    '      <div class="field"><label>個数・袋数</label><input type="number" id="hr-pack-count" placeholder="例: 10"></div>' +
    '    </div>' +
    '    <div class="grid3">' +
    '      <div class="field"><label>密閉度・密封確認</label><select id="hr-seal-check"><option value="良">良（シーラー完全密封）</option><option value="不良">不良</option></select></div>' +
    '      <div class="field"><label>ラベル・賞味期限</label><select id="hr-label-check"><option value="良">良（表示適正）</option><option value="不良">不良</option></select></div>' +
    '      <div class="field"><label>保管・出荷日</label><input type="date" id="hr-ship-date"></div>' +
    '    </div>' +
    '    <div class="field"><label>出荷確認・備考</label><input type="text" id="hr-ship-notes" placeholder="出荷先、特記事項など"></div>' +
    '  </div>' +

    '  <div style="display:flex;justify-content:flex-end;gap:12px">' +
    '    <button type="submit" id="btn-save-roast" class="bp" style="padding:14px 28px;font-size:16px;font-weight:700">💾 ロット台帳を保存</button>' +
    '  </div>' +
    '</form>' +
    '</div>';

  c.innerHTML = h;
}

function calcRoastYield(){
  var inp = Number(el('hr-input-g').value) || 0;
  var out = Number(el('hr-output-g').value) || 0;
  var yEl = el('hr-yield-pct');
  if(!yEl) return;
  if(inp > 0 && out > 0){
    var pct = Math.round((out / inp) * 1000) / 10;
    yEl.value = pct + '%';
  } else {
    yEl.value = '';
  }
}

async function generateNextLotId(){
  var t = new Date();
  var yy = String(t.getFullYear()).slice(2);
  var mm = String(t.getMonth()+1).padStart(2,'0');
  var dd = String(t.getDate()).padStart(2,'0');
  var prefix = yy + mm + dd;

  var batches = await getHaccpJson('haccp_roast_batches', []);
  var todays = batches.filter(function(b){ return b.lotId && String(b.lotId).startsWith(prefix); });
  var nextSeq = todays.length + 1;
  var nextLot = prefix + '-' + String(nextSeq).padStart(2,'0');
  var lotEl = el('hr-lot-id');
  if(lotEl) lotEl.value = nextLot;
}

async function submitHaccpRoast(){
  var btn = el('btn-save-roast');
  if(btn){ btn.disabled = true; btn.textContent = '保存中...'; }
  try {
    var record = {
      id: 'hr_' + Date.now() + Math.random().toString(36).substr(2,4),
      lotId: el('hr-lot-id').value,
      beanOrigin: el('hr-bean-origin').value,
      recvDate: el('hr-recv-date').value,
      supplierLot: el('hr-supp-lot').value,
      recvKg: Number(el('hr-recv-kg').value) || 0,
      pkgStatus: el('hr-pkg-status').value,
      defectCheck: el('hr-defect-check').value,
      roastDate: el('hr-roast-date').value,
      inputG: Number(el('hr-input-g').value) || 0,
      outputG: Number(el('hr-output-g').value) || 0,
      yieldPct: el('hr-yield-pct').value,
      coolingCheck: el('hr-cooling-check').value,
      roastDefect: el('hr-roast-defect').value,
      packDate: el('hr-pack-date').value,
      packType: el('hr-pack-type').value,
      packCount: Number(el('hr-pack-count').value) || 0,
      sealCheck: el('hr-seal-check').value,
      labelCheck: el('hr-label-check').value,
      shipDate: el('hr-ship-date').value,
      shipNotes: el('hr-ship-notes').value,
      createdAt: new Date().toISOString()
    };

    var list = await getHaccpJson('haccp_roast_batches', []);
    list.unshift(record);
    await saveHaccpJson('haccp_roast_batches', list);

    alert('✅ ロット「' + record.lotId + '」を台帳に保存しました！');
    switchHaccpSubTab('list');
  } catch(e){
    alert('保存エラー: ' + (e.message || String(e)));
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = '💾 ロット台帳を保存'; }
  }
}

// ─── 3. 本日の衛生記録一覧 ──────────────────────────────
async function renderHaccpTodayList(){
  var c = el('haccp-list-container');
  if(!c) return;
  c.innerHTML = '<div style="text-align:center;padding:30px;color:var(--sub)">読み込み中...</div>';

  var todayStr = today();
  var ym = todayStr.slice(0,7);
  var dailyList = await getHaccpJson('haccp_hygiene_' + ym, []);
  var todays = dailyList.filter(function(x){ return x.date === todayStr; });

  var roastList = await getHaccpJson('haccp_roast_batches', []);
  var todaysRoast = roastList.filter(function(x){ return x.roastDate === todayStr || x.recvDate === todayStr; });

  var h = '';

  // 本日の衛生チェック
  h += '<div class="card" style="padding:20px;margin-bottom:16px">';
  h += '  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">';
  h += '    <h3 style="font-size:16px;font-weight:700;color:var(--pri)">🧼 本日の衛生チェック記録（' + todayStr + '）</h3>';
  h += '    <button type="button" class="bp" onclick="resetHaccpWizard();switchHaccpSubTab(\'wizard\')" style="font-size:12px;padding:6px 14px">＋ 新しくチェックする</button>';
  h += '  </div>';

  if(todays.length === 0){
    h += '<div style="text-align:center;padding:30px;color:var(--sub);background:#fbf9f6;border-radius:10px">本日の衛生チェック記録はまだありません。</div>';
  } else {
    h += '<div style="display:flex;flex-direction:column;gap:10px">';
    todays.forEach(function(r){
      h += '<div style="border:1.5px solid var(--bdr);border-radius:12px;padding:12px 16px;background:#fff;display:flex;justify-content:space-between;align-items:center">';
      h += '  <div>';
      h += '    <div style="display:flex;align-items:center;gap:8px">';
      h += '      <span style="font-size:16px;font-weight:800;color:var(--pri)">' + esc(r.workerName) + '</span>';
      h += '      <span style="font-size:11px;background:#e8f5e9;color:#2e7d32;padding:2px 8px;border-radius:10px;font-weight:700">全項目 OK</span>';
      h += '    </div>';
      h += '    <div style="font-size:12px;color:var(--sub);margin-top:4px">';
      h += '      確認職員: <b>' + esc(r.staffName) + '</b>' + (r.notes ? ' / 備考: ' + esc(r.notes) : '');
      h += '    </div>';
      h += '  </div>';
      h += '  <button type="button" onclick="deleteHaccpRecord(\''+r.id+'\',\''+r.date+'\')" style="background:none;border:none;color:#c62828;cursor:pointer;font-size:13px;padding:6px">✕ 削除</button>';
      h += '</div>';
    });
    h += '</div>';
  }
  h += '</div>';

  // 本日の焙煎ロット
  h += '<div class="card" style="padding:20px;">';
  h += '  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">';
  h += '    <h3 style="font-size:16px;font-weight:700;color:var(--pri)">☕ 本日の焙煎・出荷ロット（' + todayStr + '）</h3>';
  h += '    <button type="button" class="bp" onclick="switchHaccpSubTab(\'roast\')" style="font-size:12px;padding:6px 14px">＋ ロット追加</button>';
  h += '  </div>';

  if(todaysRoast.length === 0){
    h += '<div style="text-align:center;padding:30px;color:var(--sub);background:#fbf9f6;border-radius:10px">本日の焙煎・出荷ロット記録はありません。</div>';
  } else {
    h += '<div style="display:flex;flex-direction:column;gap:10px">';
    todaysRoast.forEach(function(b){
      h += '<div style="border:1.5px solid var(--bdr);border-radius:12px;padding:12px 16px;background:#fff;display:flex;justify-content:space-between;align-items:center">';
      h += '  <div>';
      h += '    <div style="display:flex;align-items:center;gap:8px">';
      h += '      <span style="font-size:15px;font-weight:800;color:var(--pri)">ロット: ' + esc(b.lotId) + '</span>';
      h += '      <span style="font-size:13px;font-weight:700">' + esc(b.beanOrigin) + '</span>';
      h += '    </div>';
      h += '    <div style="font-size:12px;color:var(--sub);margin-top:4px">';
      h += '      投入: ' + (b.inputG||0) + 'g → 焙煎後: ' + (b.outputG||0) + 'g（歩留: <b>' + (b.yieldPct||'-') + '</b>） / 包装: ' + (b.packType||'-') + ' ' + (b.packCount||0) + '個';
      h += '    </div>';
      h += '  </div>';
      h += '  <button type="button" onclick="deleteHaccpRoastBatch(\''+b.id+'\')" style="background:none;border:none;color:#c62828;cursor:pointer;font-size:13px;padding:6px">✕ 削除</button>';
      h += '</div>';
    });
    h += '</div>';
  }
  h += '</div>';

  c.innerHTML = h;
}

async function deleteHaccpRecord(id, date){
  if(!confirm('この衛生記録を削除してもよろしいですか？')) return;
  try {
    var ym = date.slice(0,7);
    var key = 'haccp_hygiene_' + ym;
    var list = await getHaccpJson(key, []);
    list = list.filter(function(x){ return x.id !== id; });
    await saveHaccpJson(key, list);
    renderHaccpTodayList();
  } catch(e){
    alert('削除エラー: ' + (e.message || String(e)));
  }
}

async function deleteHaccpRoastBatch(id){
  if(!confirm('このロット台帳記録を削除してもよろしいですか？')) return;
  try {
    var key = 'haccp_roast_batches';
    var list = await getHaccpJson(key, []);
    list = list.filter(function(x){ return x.id !== id; });
    await saveHaccpJson(key, list);
    renderHaccpTodayList();
  } catch(e){
    alert('削除エラー: ' + (e.message || String(e)));
  }
}
</script>
