<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>本日のお昼ごはんメニュー | ひとつぎお弁当</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      padding: 20px;
    }
    .user-header {
      max-width: 1400px;
      margin: 0 auto 20px auto;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      padding: 16px 28px;
      border-radius: var(--radius-lg);
      border: 2px solid var(--border);
      box-shadow: var(--shadow-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .user-cards-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    @media (max-width: 1200px) { .user-cards-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 768px) { .user-cards-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .user-cards-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header class="user-header">
    <div style="display:flex; align-items:center; gap:14px">
      <span style="font-size:2.8rem">🍱</span>
      <div>
        <h1 style="font-size:1.8rem; font-weight:900; color:#d9480f">本日の昼食お弁当メニュー</h1>
        <p style="font-size:0.95rem; color:var(--subtext); font-weight:700">食べたいお弁当の「これにする！🎯」を押してください</p>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:12px">
      <div class="stat-badge date-badge" id="dateBadge">2026/10/07</div>
      <button class="btn btn-outline" onclick="fetchSupabaseData(true)" style="padding:10px 16px">🔄 更新</button>
      <a href="index.html" class="btn btn-pop" style="text-decoration:none">⚙️ 管理画面</a>
    </div>
  </header>

  <!-- メイン カード一覧 -->
  <main style="max-width:1400px; margin:0 auto">
    <div class="user-cards-grid" id="todaysMenuGrid">
      <!-- 今日5品を表示 -->
    </div>
  </main>

  <!-- お名前選択モーダル -->
  <div class="modal-overlay" id="userSelectForBentoModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="selectUserModalBentoTitle">🍱 お名前を選択してください</h3>
        <button class="close-btn" onclick="closeUserSelectForBentoModal()">&times;</button>
      </div>
      <div class="user-picker-grid" id="userPickerList">
        <!-- 動的表示 -->
      </div>
      <div style="text-align:center; margin-top:10px">
        <button class="btn btn-outline" onclick="closeUserSelectForBentoModal()">キャンセル</button>
      </div>
    </div>
  </div>

  <script src="supabase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
